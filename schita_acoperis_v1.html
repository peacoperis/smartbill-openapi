<!-- GEO — motorul de geometrie (JavaScript pur, testat separat)  -->
<!-- Coordonate model: metri, y crește în sus. SVG inversează y.  -->
<!-- ============================================================ -->
<script>
const Geo = (() => {
    const EPS = 1e-9;
    const round2 = (v) => Math.round(v * 100) / 100;

    const dist = (a, b) => Math.hypot(b.x - a.x, b.y - a.y);

    // Aria cu semn (shoelace). >0 = poligon în sens trigonometric (CCW).
    const signedArea = (pts) => {
        let s = 0;
        for (let i = 0; i < pts.length; i++) {
            const a = pts[i], b = pts[(i + 1) % pts.length];
            s += a.x * b.y - b.x * a.y;
        }
        return s / 2;
    };
    const polygonArea = (pts) => Math.abs(signedArea(pts));

    const centroid = (pts) => {
        let x = 0, y = 0;
        pts.forEach(p => { x += p.x; y += p.y; });
        return { x: x / pts.length, y: y / pts.length };
    };

    const bounds = (pts) => {
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        pts.forEach(p => {
            minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
            minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
        });
        return { minX, minY, maxX, maxY };
    };

    // ------------------------------------------------------------
    // Detecția fețelor dintr-un graf planar (vertices + edges).
    // Half-edge: la fiecare vârf muchiile ies sortate după unghi;
    // succesorul lui u→v e următoarea muchie în sens orar după v→u,
    // ceea ce parcurge fiecare față interioară în sens trigonometric.
    // ------------------------------------------------------------
    const detectFaces = (vertices, edges) => {
        const out = new Map();
        edges.forEach((e, ei) => {
            const add = (from, to) => {
                if (!out.has(from)) out.set(from, []);
                const dx = vertices[to].x - vertices[from].x;
                const dy = vertices[to].y - vertices[from].y;
                out.get(from).push({ to, edgeId: ei, angle: Math.atan2(dy, dx) });
            };
            add(e.a, e.b);
            add(e.b, e.a);
        });
        out.forEach(list => list.sort((p, q) => p.angle - q.angle));

        const visited = new Set();
        const faces = [];
        out.forEach((list, from) => {
            list.forEach(he => {
                if (visited.has(from + ':' + he.to + ':' + he.edgeId)) return;
                const vertIds = [], edgeIds = [];
                let cf = from, che = he;
                let guard = 0;
                while (guard++ < 10000) {
                    const key = cf + ':' + che.to + ':' + che.edgeId;
                    if (visited.has(key)) break;
                    visited.add(key);
                    vertIds.push(cf);
                    edgeIds.push(che.edgeId);
                    const lst = out.get(che.to);
                    const idx = lst.findIndex(o => o.to === cf && o.edgeId === che.edgeId);
                    const nxt = lst[(idx - 1 + lst.length) % lst.length];
                    cf = che.to; che = nxt;
                    if (cf === from && che.to === he.to && che.edgeId === he.edgeId) break;
                }
                if (vertIds.length >= 3) {
                    const pts = vertIds.map(i => vertices[i]);
                    const sa = signedArea(pts);
                    if (sa > EPS) faces.push({ vertIds, edgeIds, area: sa });
                }
            });
        });
        return faces;
    };

    // ------------------------------------------------------------
    // Sensul de scurgere auto: perpendicular pe streașina probabilă
    // (cea mai lungă muchie de contur, cu bonus dacă e paralelă cu
    // coama probabilă), dinspre centroid spre exterior.
    // ------------------------------------------------------------
    const autoFlowDir = (vertices, edges, face, edgeFaceCount) => {
        let ridgeDir = null, ridgeLen = -1;
        face.edgeIds.forEach(eid => {
            if (edgeFaceCount[eid] !== 2) return;
            const e = edges[eid];
            const L = dist(vertices[e.a], vertices[e.b]);
            if (L > ridgeLen) {
                ridgeLen = L;
                ridgeDir = { x: (vertices[e.b].x - vertices[e.a].x) / L, y: (vertices[e.b].y - vertices[e.a].y) / L };
            }
        });
        let best = null, bestScore = -1;
        face.edgeIds.forEach(eid => {
            if (edgeFaceCount[eid] !== 1) return;
            const e = edges[eid];
            const L = dist(vertices[e.a], vertices[e.b]);
            let score = L;
            if (ridgeDir && L > 0) {
                const ux = (vertices[e.b].x - vertices[e.a].x) / L;
                const uy = (vertices[e.b].y - vertices[e.a].y) / L;
                score = L * (1 + 0.5 * Math.abs(ux * ridgeDir.x + uy * ridgeDir.y));
            }
            if (score > bestScore) { bestScore = score; best = e; }
        });
        if (!best) return { x: 0, y: -1 };
        const A = vertices[best.a], B = vertices[best.b];
        const mid = { x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 };
        const c = centroid(face.vertIds.map(i => vertices[i]));
        const ex = B.x - A.x, ey = B.y - A.y;
        const L = Math.hypot(ex, ey) || 1;
        let nx = ey / L, ny = -ex / L;
        if ((mid.x - c.x) * nx + (mid.y - c.y) * ny < 0) { nx = -nx; ny = -ny; }
        return { x: nx, y: ny };
    };

    // ------------------------------------------------------------
    // Clasificarea automată a muchiilor:
    // streasina | pazie | coama | muchie | dolie
    // ------------------------------------------------------------
    const classifyEdges = (vertices, edges, faces, flowByFace) => {
        const incident = edges.map(() => []);
        faces.forEach((f, fi) => f.edgeIds.forEach((eid, j) => {
            incident[eid].push({ fi, from: f.vertIds[j], to: f.vertIds[(j + 1) % f.vertIds.length] });
        }));
        const PERP_TOL = Math.cos(70 * Math.PI / 180);

        // fluxul iese din față peste muchie? (flow · normala interioară < 0)
        const flowExits = (inc) => {
            const A = vertices[inc.from], B = vertices[inc.to];
            const L = dist(A, B) || 1;
            const nx = -(B.y - A.y) / L, ny = (B.x - A.x) / L;
            const flow = flowByFace.get(inc.fi) || { x: 0, y: -1 };
            return flow.x * nx + flow.y * ny < -0.05;
        };

        return edges.map((e, ei) => {
            const A = vertices[e.a], B = vertices[e.b];
            const L = dist(A, B) || 1;
            const ux = (B.x - A.x) / L, uy = (B.y - A.y) / L;
            const inc = incident[ei];

            if (inc.length === 1) {
                const flow = flowByFace.get(inc[0].fi) || { x: 0, y: -1 };
                if (Math.abs(ux * flow.x + uy * flow.y) > 0.5) return 'pazie';
                return flowExits(inc[0]) ? 'streasina' : 'coama';
            }
            if (inc.length === 2) {
                if (inc.every(flowExits)) return 'dolie';
                const perpBoth = inc.every(i2 => {
                    const flow = flowByFace.get(i2.fi) || { x: 0, y: -1 };
                    return Math.abs(ux * flow.x + uy * flow.y) < PERP_TOL;
                });
                return perpBoth ? 'coama' : 'muchie';
            }
            return 'racord';
        });
    };

    // ------------------------------------------------------------
    // Desfășurarea unei fețe: rotește cu streașina pe orizontală,
    // scalează pe pantă cu k = L_real / L_plan, mută min la (0,0).
    // ------------------------------------------------------------
    const unfoldFace = (pts, eaveA, eaveB, k) => {
        const ang = Math.atan2(eaveB.y - eaveA.y, eaveB.x - eaveA.x);
        const cos = Math.cos(-ang), sin = Math.sin(-ang);
        let out = pts.map(p => ({
            x: (p.x - eaveA.x) * cos - (p.y - eaveA.y) * sin,
            y: (p.x - eaveA.x) * sin + (p.y - eaveA.y) * cos
        }));
        const c = centroid(out);
        if (c.y < 0) out = out.map(p => ({ x: p.x, y: -p.y }));
        out = out.map(p => ({ x: p.x, y: p.y * k }));
        const b = bounds(out);
        return out.map(p => ({ x: p.x - b.minX, y: p.y - b.minY }));
    };

    // Adâncimea în plan a pantei (distanța maximă față de streașină)
    const planSlopeDepth = (pts, eaveA, eaveB) => {
        const ex = eaveB.x - eaveA.x, ey = eaveB.y - eaveA.y;
        const L = Math.hypot(ex, ey) || 1;
        const nx = -ey / L, ny = ex / L;
        let maxD = 0;
        pts.forEach(p => {
            const d = Math.abs((p.x - eaveA.x) * nx + (p.y - eaveA.y) * ny);
            maxD = Math.max(maxD, d);
        });
        return maxD;
    };

    // ------------------------------------------------------------
    // Tăierea poligonului la banda verticală [x0,x1] (Sutherland–Hodgman)
    // ------------------------------------------------------------
    const clipHalf = (pts, inside, cross) => {
        const out = [];
        for (let i = 0; i < pts.length; i++) {
            const cur = pts[i], prev = pts[(i + pts.length - 1) % pts.length];
            const ci = inside(cur), pi = inside(prev);
            if (ci) {
                if (!pi) out.push(cross(prev, cur));
                out.push(cur);
            } else if (pi) {
                out.push(cross(prev, cur));
            }
        }
        return out;
    };
    const clipBandX = (pts, x0, x1) => {
        const crossAt = (X) => (p, q) => {
            const t = (X - p.x) / (q.x - p.x);
            return { x: X, y: p.y + t * (q.y - p.y) };
        };
        let r = clipHalf(pts, p => p.x >= x0 - EPS, crossAt(x0));
        if (r.length) r = clipHalf(r, p => p.x <= x1 + EPS, crossAt(x1));
        return r;
    };

    // ------------------------------------------------------------
    // Lungimi valide de fabricație: k·modul + streașină (foaia de jos)
    // sau k·modul (foile superioare); fără modul → pas de tăiere.
    // ------------------------------------------------------------
    const roundLen = (raw, cfg, isTop) => {
        let len;
        if (cfg.module > 0) {
            const extra = isTop ? 0 : (cfg.eaveExtra || 0);
            const k = Math.max(1, Math.ceil((raw - extra - EPS) / cfg.module));
            len = k * cfg.module + extra;
        } else {
            const step = cfg.lengthStep || 0.05;
            len = Math.ceil(raw / step - EPS) * step;
        }
        return round2(Math.max(len, cfg.minLen || 0));
    };
    const maxValidLen = (cap, cfg, isTop) => {
        if (cfg.module > 0) {
            const extra = isTop ? 0 : (cfg.eaveExtra || 0);
            const k = Math.max(1, Math.floor((cap - extra + EPS) / cfg.module));
            return round2(k * cfg.module + extra);
        }
        const step = cfg.lengthStep || 0.05;
        return round2(Math.floor(cap / step + EPS) * step);
    };

    // ------------------------------------------------------------
    // PANOTAJ. pts = versantul desfășurat (metri, y=0 la streașină).
    // ------------------------------------------------------------
    const computePanotaj = (ptsIn, cfg) => {
        if (!ptsIn || ptsIn.length < 3) return null;
        const b0 = bounds(ptsIn);
        let pts = ptsIn.map(p => ({ x: p.x - b0.minX, y: p.y - b0.minY }));
        const bb = bounds(pts);
        if (cfg.startSide === 'right') pts = pts.map(p => ({ x: bb.maxX - p.x, y: p.y }));

        const W = cfg.W;
        const off = cfg.startOffset || 0;
        const n = Math.max(1, Math.ceil((bb.maxX - off - EPS) / W));
        const strips = [];
        let sheetNo = 0;
        const allSheets = [];

        for (let i = 0; i < n; i++) {
            const x0 = off + i * W;
            const x1 = Math.min(x0 + W, bb.maxX);
            if (x1 - x0 < 0.005) continue;
            const clipped = clipBandX(pts, x0, x1);
            if (clipped.length < 3 || polygonArea(clipped) < 1e-4) continue;
            const cb = bounds(clipped);
            const rawLen = cb.maxY - cb.minY;

            // foile benzii, de jos în sus; despicare peste maxLen cu
            // suprapunere: acoperirea efectivă = Σ len − overlap·(n−1)
            const sheets = [];
            let covered = 0;
            let first = true;
            let guard = 0;
            while (covered < rawLen - 1e-6 && guard++ < 20) {
                const remaining = rawLen - covered + (first ? 0 : cfg.overlap);
                const need = roundLen(remaining, cfg, !first);
                const len = need <= cfg.maxLen + EPS ? need : maxValidLen(cfg.maxLen, cfg, !first);
                const yFrom = cb.minY + covered - (first ? 0 : cfg.overlap);
                sheets.push({ len, yFrom });
                covered = (yFrom - cb.minY) + len;
                first = false;
            }
            sheets.forEach(s => { s.split = sheets.length > 1; });

            sheetNo++;
            const letters = 'abcdefgh';
            sheets.forEach((s, si) => {
                s.no = sheets.length > 1 ? `${sheetNo}${letters[si]}` : String(sheetNo);
                s.stripIdx = i;
            });
            strips.push({ x0, x1, rawLen: round2(rawLen), yMin: cb.minY, clipped, sheets });
            allSheets.push(...sheets);
        }

        const polyArea = polygonArea(pts);
        const panelArea = allSheets.reduce((s, sh) => s + sh.len * W, 0);
        const orderMap = new Map();
        allSheets.forEach(sh => {
            const key = sh.len.toFixed(2);
            orderMap.set(key, (orderMap.get(key) || 0) + 1);
        });
        const orderList = [...orderMap.entries()]
            .map(([len, qty]) => ({ len: parseFloat(len), qty }))
            .sort((a, b) => b.len - a.len);

        return {
            strips,
            sheets: allSheets,
            mirrored: cfg.startSide === 'right',
            width: bb.maxX, height: bb.maxY,
            polyArea: round2(polyArea),
            panelArea: round2(panelArea),
            wastePct: polyArea > 0 ? Math.round((panelArea - polyArea) / polyArea * 100) : 0,
            orderList
        };
    };

    // ------------------------------------------------------------
    // Șabloane de plan (grafuri garantat valide).
    // ------------------------------------------------------------
    const tpl2Ape = (L, W) => ({
        vertices: [
            { x: 0, y: 0 }, { x: L, y: 0 },
            { x: L, y: W }, { x: 0, y: W },
            { x: 0, y: W / 2 }, { x: L, y: W / 2 }
        ],
        edges: [
            { a: 0, b: 1 }, { a: 1, b: 5 }, { a: 5, b: 2 },
            { a: 2, b: 3 }, { a: 3, b: 4 }, { a: 4, b: 0 },
            { a: 4, b: 5 }
        ]
    });

    const tpl4Ape = (L, W) => {
        const h = W / 2;
        return {
            vertices: [
                { x: 0, y: 0 }, { x: L, y: 0 }, { x: L, y: W }, { x: 0, y: W },
                { x: h, y: h }, { x: L - h, y: h }
            ],
            edges: [
                { a: 0, b: 1 }, { a: 1, b: 2 }, { a: 2, b: 3 }, { a: 3, b: 0 },
                { a: 0, b: 4 }, { a: 3, b: 4 },
                { a: 1, b: 5 }, { a: 2, b: 5 },
                { a: 4, b: 5 }
            ]
        };
    };

    // Formă în L, 2 ape pe fiecare aripă, dolie la colțul interior.
    const tplL = (L1, W1, L2, W2) => {
        const v = [
            { x: 0, y: 0 }, { x: L1, y: 0 },
            { x: L1, y: W1 },
            { x: L1, y: W1 + L2 }, { x: L1 - W2, y: W1 + L2 },
            { x: L1 - W2, y: W1 }, { x: 0, y: W1 },
            { x: 0, y: W1 / 2 },
            { x: L1 - W2 / 2, y: W1 / 2 },
            { x: L1 - W2 / 2, y: W1 + L2 }
        ];
        const e = [
            { a: 0, b: 1 }, { a: 1, b: 2 }, { a: 2, b: 3 },
            { a: 3, b: 9 }, { a: 9, b: 4 },
            { a: 4, b: 5 }, { a: 5, b: 6 }, { a: 6, b: 7 }, { a: 7, b: 0 },
            { a: 7, b: 8 },
            { a: 8, b: 9 },
            { a: 5, b: 8 },
            { a: 2, b: 8 }
        ];
        return { vertices: v, edges: e };
    };

    return {
        EPS, round2, dist, signedArea, polygonArea, centroid, bounds,
        detectFaces, autoFlowDir, classifyEdges,
        unfoldFace, planSlopeDepth, clipBandX,
        roundLen, maxValidLen, computePanotaj,
        tpl2Ape, tpl4Ape, tplL
    };
})();
</script>

        },
        plan: { vertices: [], edges: [], chimneys: [] },
        faceOverrides: {},   // faceKey (centroid+arie) → { name, L_real, flowAngle, startSide }
        edgeOverrides: {},   // edgeKey (coordonate) → type
        pluvial: { hasGutters: true, carligeAuto: true, carligeCount: 0, scurgeri: 2, hasBurlane: true, burlanMlPerScurgere: 3.5 },

    // ============================================
    // CALCUL DERIVAT: plan → fețe → desfășurate → panotaj → totaluri muchii
    // ============================================
    // chei stabile pe coordonate (rezistă la reindexări după editări)
    const edgeKeyOf = (e, vertices) => {
        const A = vertices[e.a], B = vertices[e.b];
        const pa = `${A.x.toFixed(2)},${A.y.toFixed(2)}`, pb = `${B.x.toFixed(2)},${B.y.toFixed(2)}`;
        return pa < pb ? pa + '|' + pb : pb + '|' + pa;
    };
    const faceKeyOf = (face, vertices) => {
        const c = Geo.centroid(face.vertIds.map(i => vertices[i]));
        return `${c.x.toFixed(1)}_${c.y.toFixed(1)}_${face.area.toFixed(1)}`;
    };

    const computeDerived = (project) => {
        const { vertices, edges } = project.plan;
        const mat = project.material;
        if (!vertices.length || !edges.length) {
            return { faces: [], edgeTypes: [], edgeFaceCount: [], sums: {}, ready: false };
        }
        const rawFaces = Geo.detectFaces(vertices, edges);
        const edgeFaceCount = edges.map(() => 0);
        rawFaces.forEach(f => f.edgeIds.forEach(e => edgeFaceCount[e]++));

        // ordonare stabilă: după centroid (y apoi x)
        rawFaces.sort((f1, f2) => {
            const c1 = Geo.centroid(f1.vertIds.map(i => vertices[i]));
            const c2 = Geo.centroid(f2.vertIds.map(i => vertices[i]));
            return (c1.y - c2.y) || (c1.x - c2.x);
        });

        // sens de scurgere (auto sau override prin unghi)
        const flowByFace = new Map();
        rawFaces.forEach((f, fi) => {
            const key = faceKeyOf(f, vertices);
            const ov = project.faceOverrides[key];
            if (ov && typeof ov.flowAngle === 'number') {
                flowByFace.set(fi, { x: Math.cos(ov.flowAngle), y: Math.sin(ov.flowAngle) });
            } else {
                flowByFace.set(fi, Geo.autoFlowDir(vertices, edges, f, edgeFaceCount));
            }
        });

        // tipuri muchii (auto + override pe cheie de coordonate)
        const autoTypes = Geo.classifyEdges(vertices, edges, rawFaces, flowByFace);
        const edgeTypes = autoTypes.map((t, ei) => project.edgeOverrides[edgeKeyOf(edges[ei], vertices)] || t);

        // fețele complete: streașină proprie, desfășurare, panotaj
        const cfgBase = {
            W: mat.W, minLen: mat.minLen, maxLen: mat.maxLen,
            module: mat.module, eaveExtra: mat.eaveExtra,
            overlap: mat.overlap, lengthStep: mat.lengthStep
        };
        const faces = rawFaces.map((f, fi) => {
            const key = faceKeyOf(f, vertices);
            const ov = project.faceOverrides[key] || {};
            const pts = f.vertIds.map(i => vertices[i]);
            const flow = flowByFace.get(fi);

            // streașina feței: cea mai lungă muchie proprie tip streașină;
            // fallback: cea mai lungă muchie de contur
            let eave = null, eaveLen = -1;
            const pick = (wantType) => f.edgeIds.forEach(eid => {
                if (wantType && edgeTypes[eid] !== wantType) return;
                if (!wantType && edgeFaceCount[eid] !== 1) return;
                const e = edges[eid];
                const L = Geo.dist(vertices[e.a], vertices[e.b]);
                if (L > eaveLen) { eaveLen = L; eave = { ...e, id: eid }; }
            });
            pick('streasina');
            if (!eave) pick(null);
            if (!eave) { const e = edges[f.edgeIds[0]]; eave = { ...e, id: f.edgeIds[0] }; }

            const A = vertices[eave.a], B = vertices[eave.b];
            const L_plan = Geo.round2(Geo.planSlopeDepth(pts, A, B));
            const L_real = ov.L_real || null;
            const k = L_real && L_plan > 0 ? L_real / L_plan : 1;
            const unfolded = Geo.unfoldFace(pts, A, B, k);
            const startSide = ov.startSide || 'left';
            const panotaj = Geo.computePanotaj(unfolded, { ...cfgBase, startSide });

            return {
                fi, key, raw: f, pts,
                name: ov.name || `Versant ${fi + 1}`,
                flow, eave, L_plan, L_real, k: Geo.round2(k),
                missingPitch: !L_real,
                unfolded, panotaj, startSide,
                planArea: Geo.round2(f.area),
                realArea: panotaj ? panotaj.polyArea : 0
            };
        });

        // lungimi reale ale muchiilor: componenta de-a lungul streașinii feței
        // rămâne, componenta pe pantă se scalează cu k; medie pe fețele adiacente
        const edgeRealLen = edges.map((e, ei) => {
            const A = vertices[e.a], B = vertices[e.b];
            const planLen = Geo.dist(A, B);
            const adj = faces.filter(fc => fc.raw.edgeIds.includes(ei));
            if (!adj.length) return planLen;
            const reals = adj.map(fc => {
                const eA = vertices[fc.eave.a], eB = vertices[fc.eave.b];
                const eL = Geo.dist(eA, eB) || 1;
                const ux = (eB.x - eA.x) / eL, uy = (eB.y - eA.y) / eL;
                const dx = B.x - A.x, dy = B.y - A.y;
                const along = Math.abs(dx * ux + dy * uy);
                const across = Math.abs(dx * (-uy) + dy * ux);
                return Math.hypot(along, across * fc.k);
            });
            return reals.reduce((s, v) => s + v, 0) / reals.length;
        });

        // sume pe tip de muchie (fiecare muchie o singură dată — avantajul grafului)
        const sums = {};
        Object.keys(EDGE_TYPES).forEach(t => sums[t] = 0);
        edges.forEach((e, ei) => { sums[edgeTypes[ei]] = (sums[edgeTypes[ei]] || 0) + edgeRealLen[ei]; });
        Object.keys(sums).forEach(t => sums[t] = Geo.round2(sums[t]));

        const totalRealArea = Geo.round2(faces.reduce((s, f) => s + f.realArea, 0));
        const totalPanelArea = Geo.round2(faces.reduce((s, f) => s + (f.panotaj ? f.panotaj.panelArea : 0), 0));

        // lista de comandă globală (lungime → buc, toate fețele)
        const orderMap = new Map();
        faces.forEach(f => (f.panotaj ? f.panotaj.sheets : []).forEach(sh => {
            const key = sh.len.toFixed(2);
            orderMap.set(key, (orderMap.get(key) || 0) + 1);
        }));
        const globalOrder = [...orderMap.entries()]
            .map(([len, qty]) => ({ len: parseFloat(len), qty }))
            .sort((a, b) => b.len - a.len);

        return {
            faces, edgeTypes, edgeFaceCount, edgeRealLen, sums,
            totalRealArea, totalPanelArea, globalOrder,
            totalSheets: globalOrder.reduce((s, o) => s + o.qty, 0),
            missingPitch: faces.some(f => f.missingPitch),
            ready: faces.length > 0
        };
    };

    // ============================================
    // NECESAR: derivă rândurile de materiale din geometrie + cataloage
    // ============================================
    const buildNecesar = (project, derived) => {
        if (!derived.ready) return [];
        const mat = project.material;
        const prov = PROVIDERS[mat.provider] || { margin: 0, currency: 'RON' };
        const toRON = (p) => prov.currency === 'EUR' ? p * (prov.exchange || 5) : p;
        const sums = derived.sums;
        const rows = [];

        const tigla = (((TIGLA_CATALOG[mat.provider] || {})[mat.thickness] || {})[mat.finish]) || { price: 0 };
        rows.push({
            key: 'tigla', label: `Țiglă metalică ${mat.profile} ${mat.thickness}mm ${mat.finish} RAL ${mat.color}`,
            detail: `${derived.totalSheets} foi conform panotaj`,
            qty: derived.totalPanelArea, unit: 'm²', priceRON: toRON(tigla.price)
        });

        const addBar = (key, ml) => {
            const acc = ACCESSORIES_CATALOG[key];
            if (!acc || ml <= 0.01) return;
            rows.push({
                key, label: acc.label, detail: `${Geo.round2(ml)} ml`,
                qty: Math.ceil(ml / acc.utilLen), unit: acc.unit, priceRON: toRON(acc.price)
            });
        };
        addBar('coama', (sums.coama || 0) + (sums.muchie || 0));
        addBar('dolie', sums.dolie || 0);
        addBar('sortStreasina', sums.streasina || 0);
        addBar('pazie', sums.pazie || 0);

        const nCos = project.plan.chimneys.length;
        if (nCos > 0) {
            const acc = ACCESSORIES_CATALOG.borduraCos;
            rows.push({ key: 'borduraCos', label: acc.label, detail: `${nCos} coșuri`, qty: nCos, unit: acc.unit, priceRON: toRON(acc.price) });
        }

        const folie = ACCESSORIES_CATALOG.folie;
        rows.push({
            key: 'folie', label: folie.label, detail: `${derived.totalRealArea} m² acoperiș`,
            qty: Math.max(1, Math.ceil(derived.totalRealArea / (folie.rollSqm * folie.utilFactor))),
            unit: folie.unit, priceRON: toRON(folie.price)
        });

        const sur = ACCESSORIES_CATALOG.suruburi;
        rows.push({
            key: 'suruburi', label: sur.label, detail: `${sur.perSqm} buc/m²`,
            qty: Math.max(1, Math.ceil(derived.totalPanelArea * sur.perSqm / sur.box)),
            unit: sur.unit, priceRON: toRON(sur.price)
        });

        // pluvial
        const pl = project.pluvial;
        if (pl.hasGutters && (sums.streasina || 0) > 0.01) {
            const ml = sums.streasina;
            const jg = PLUVIAL_CATALOG.jgheab;
            rows.push({ key: 'jgheab', label: jg.label, detail: `${Geo.round2(ml)} ml streașină`, qty: Math.ceil(ml / jg.utilLen), unit: jg.unit, priceRON: toRON(jg.price) });
            const ca = PLUVIAL_CATALOG.carlig;
            const nCarlige = pl.carligeAuto ? Math.ceil(ml * ca.perMl) : (pl.carligeCount || 0);
            rows.push({ key: 'carlig', label: ca.label, detail: pl.carligeAuto ? `${ca.perMl} buc/ml` : 'manual', qty: nCarlige, unit: ca.unit, priceRON: toRON(ca.price) });
            if (pl.scurgeri > 0) {
                const ra = PLUVIAL_CATALOG.racord;

    // ============================================

    const ScreenClient = ({ project, update }) => {

                <Card>

                </Card>

                <Card>
                    <div className="font-bold text-slate-700 mb-1 flex items-center gap-2"><Icon name="Ruler" size={18}/> Parametri foi (din profil, editabili)</div>
                    <div className="text-xs text-slate-400 mb-3">Se completează automat din profilul ales — modifică doar dacă știi altă specificație de la furnizor.</div>
                    <div className="grid grid-cols-3 md:grid-cols-6 gap-3">
                        {[['W', 'Lățime utilă'], ['module', 'Modul'], ['eaveExtra', 'Streașină'], ['minLen', 'Lung. min'], ['maxLen', 'Lung. max'], ['overlap', 'Suprapunere']].map(([k, lbl]) => (
                            <Field key={k} label={lbl + ' (m)'}>
                                <input type="number" step="0.01" value={mat[k]}
                                    onChange={e => update({ material: { ...mat, [k]: parseFloat(e.target.value) || 0 } })}

        );
    };

    // ============================================
    // GEOMETRIE DE EDITOR (operații pe graful planului)
    // ============================================
    const pointInPoly = (pt, pts) => {
        let inside = false;
        for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
            const xi = pts[i].x, yi = pts[i].y, xj = pts[j].x, yj = pts[j].y;
            if (((yi > pt.y) !== (yj > pt.y)) && (pt.x < (xj - xi) * (pt.y - yi) / (yj - yi) + xi)) inside = !inside;
        }
        return inside;
    };

    // intersecție proprie a segmentelor (fără capete comune)
    const segIntersect = (p1, p2, p3, p4) => {
        const d1x = p2.x - p1.x, d1y = p2.y - p1.y, d2x = p4.x - p3.x, d2y = p4.y - p3.y;
        const den = d1x * d2y - d1y * d2x;
        if (Math.abs(den) < 1e-12) return null;
        const t = ((p3.x - p1.x) * d2y - (p3.y - p1.y) * d2x) / den;
        const u = ((p3.x - p1.x) * d1y - (p3.y - p1.y) * d1x) / den;
        const E = 1e-6;
        if (t <= E || t >= 1 - E || u <= E || u >= 1 - E) return null;
        return { x: p1.x + t * d1x, y: p1.y + t * d1y, t };
    };

    const nearestOnSegment = (p, a, b) => {
        const dx = b.x - a.x, dy = b.y - a.y;
        const L2 = dx * dx + dy * dy;
        const t = L2 > 0 ? Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / L2)) : 0;
        const q = { x: a.x + t * dx, y: a.y + t * dy };
        return { q, t, d: Math.hypot(p.x - q.x, p.y - q.y) };
    };

    const snap05 = (v) => Math.round(v * 20) / 20;      // 5 cm
    const snapGrid = (p, step) => ({ x: Math.round(p.x / step) * step, y: Math.round(p.y / step) * step });

    // găsește sau creează vârful la poziția p (tol pentru lipire de vârf/muchie existentă)
    const attachPoint = (plan, p, tol) => {
        const { vertices, edges } = plan;
        let best = -1, bestD = tol;
        vertices.forEach((v, i) => {
            const d = Math.hypot(v.x - p.x, v.y - p.y);
            if (d < bestD) { bestD = d; best = i; }
        });
        if (best >= 0) return best;
        // pe o muchie? → despică muchia
        let bestE = -1, bestQ = null, bestED = tol;
        edges.forEach((e, ei) => {
            const r = nearestOnSegment(p, vertices[e.a], vertices[e.b]);
            if (r.d < bestED && r.t > 0.02 && r.t < 0.98) { bestED = r.d; bestE = ei; bestQ = r.q; }
        });
        if (bestE >= 0) {
            const ni = vertices.length;
            vertices.push({ x: snap05(bestQ.x), y: snap05(bestQ.y) });
            const e = edges[bestE];
            edges.splice(bestE, 1, { a: e.a, b: ni }, { a: ni, b: e.b });
            return ni;
        }
        vertices.push({ x: p.x, y: p.y });
        return vertices.length - 1;
    };

    // adaugă muchia P–Q în graf, despicând muchiile intersectate
    const addLineToPlan = (planIn, P, Q, tol) => {
        const plan = { ...planIn, vertices: planIn.vertices.map(v => ({ ...v })), edges: planIn.edges.map(e => ({ ...e })) };
        const ia = attachPoint(plan, P, tol);
        const ib = attachPoint(plan, Q, tol);
        if (ia === ib) return planIn;
        const A = plan.vertices[ia], B = plan.vertices[ib];
        // taie muchiile existente care traversează segmentul
        const cuts = [];
        plan.edges.forEach((e, ei) => {
            const X = segIntersect(A, B, plan.vertices[e.a], plan.vertices[e.b]);
            if (X) cuts.push({ ei, X });
        });
        // despică de la coadă la cap ca să nu strice indecșii
        const chain = [{ t: 0, vi: ia }, { t: 1, vi: ib }];
        cuts.sort((c1, c2) => c2.ei - c1.ei).forEach(({ ei, X }) => {
            const ni = plan.vertices.length;
            plan.vertices.push({ x: snap05(X.x), y: snap05(X.y) });
            const e = plan.edges[ei];
            plan.edges.splice(ei, 1, { a: e.a, b: ni }, { a: ni, b: e.b });
            chain.push({ t: X.t, vi: ni });
        });
        chain.sort((c1, c2) => c1.t - c2.t);
        for (let i = 0; i < chain.length - 1; i++) {
            const a = chain[i].vi, b = chain[i + 1].vi;
            if (a !== b && !plan.edges.some(e => (e.a === a && e.b === b) || (e.a === b && e.b === a))) {
                plan.edges.push({ a, b });
            }
        }
        return plan;
    };

    // adaugă un contur închis (poligonul streșinilor) în graf
    const addContourToPlan = (planIn, pts, tol) => {
        let plan = planIn;
        for (let i = 0; i < pts.length; i++) {
            plan = addLineToPlan(plan, pts[i], pts[(i + 1) % pts.length], tol);
        }
        return plan;
    };

    // șterge o muchie + vârfurile rămase orfane
    const removeEdgeFromPlan = (planIn, ei) => {
        const edges = planIn.edges.filter((_, i) => i !== ei);
        return compactPlan({ ...planIn, edges });
    };
    const removeVertexFromPlan = (planIn, vi) => {
        const edges = planIn.edges.filter(e => e.a !== vi && e.b !== vi);
        return compactPlan({ ...planIn, edges });
    };
    const compactPlan = (planIn) => {
        const used = new Set();
        planIn.edges.forEach(e => { used.add(e.a); used.add(e.b); });
        const map = new Map();
        const vertices = [];
        planIn.vertices.forEach((v, i) => { if (used.has(i)) { map.set(i, vertices.length); vertices.push(v); } });
        const edges = planIn.edges.map(e => ({ a: map.get(e.a), b: map.get(e.b) }));
        return { ...planIn, vertices, edges };
    };

    // snap pentru desen: grilă 0,25 m + unghiuri 45° față de punctul anterior
    const snapDraw = (p, prev) => {
        let q = snapGrid(p, 0.25);
        if (prev) {
            const dx = p.x - prev.x, dy = p.y - prev.y;
            const L = Math.hypot(dx, dy);
            if (L > 0.2) {
                const ang = Math.atan2(dy, dx);
                const snap45 = Math.round(ang / (Math.PI / 4)) * (Math.PI / 4);
                if (Math.abs(ang - snap45) < 7 * Math.PI / 180) {
                    const Ls = snap05(L);
                    q = { x: snap05(prev.x + Ls * Math.cos(snap45)), y: snap05(prev.y + Ls * Math.sin(snap45)) };
                }
            }
        }
        return q;
    };

    // ============================================
    // ECRAN: PLAN (editor desen)
    // ============================================
    const FACE_TINTS = ['#fecaca', '#bfdbfe', '#bbf7d0', '#fde68a', '#e9d5ff', '#fbcfe8', '#a5f3fc', '#d9f99d'];

    const TplModal = ({ kind, onOk, onCancel }) => {
        const isL = kind === 'L';
        const [vals, setVals] = useState(isL ? { L1: 12, W1: 8, L2: 6, W2: 8 } : { L: 10, W: 8 });
        const fields = isL
            ? [['L1', 'Lungime corp principal'], ['W1', 'Lățime corp principal'], ['L2', 'Lungime aripă'], ['W2', 'Lățime aripă']]
            : [['L', 'Lungime casă (streașină)'], ['W', 'Lățime casă']];
        return (
            <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50" onClick={onCancel}>
                <div className="bg-white rounded-2xl p-5 w-80 shadow-2xl animate-in" onClick={e => e.stopPropagation()}>
                    <div className="font-bold text-slate-700 mb-3">Dimensiuni la streașină ({kind === '2ape' ? '2 ape' : kind === '4ape' ? '4 ape' : 'formă L'})</div>
                    <div className="space-y-3">
                        {fields.map(([k, lbl]) => (
                            <Field key={k} label={lbl + ' (m)'}>
                                <input type="number" step="0.1" inputMode="decimal" value={vals[k]}
                                    onChange={e => setVals(v => ({ ...v, [k]: parseFloat(e.target.value) || 0 }))}
                                    className="w-full px-3 py-3 rounded-lg border border-slate-300 text-lg font-mono"/>
                            </Field>
                        ))}
                    </div>
                    <div className="flex gap-2 mt-4">
                        <button onClick={onCancel} className="flex-1 h-12 rounded-xl bg-slate-200 font-bold text-slate-600">Anulează</button>
                        <button onClick={() => onOk(vals)} className="flex-1 h-12 rounded-xl bg-red-600 text-white font-bold">Desenează</button>
                    </div>
                </div>
            </div>
        );
    };

    const ScreenPlan = ({ project, update, derived }) => {
        const plan = project.plan;
        const [tool, setTool] = useState('select');           // select | draw | line | cos
        const [vb, setVb] = useState({ x: -2, y: -12, w: 20, h: 14 }); // svg coords (y = −world)
        const [pending, setPending] = useState([]);           // conturul în desenare
        const [lineStart, setLineStart] = useState(null);
        const [sel, setSel] = useState(null);                 // {type:'edge'|'vertex'|'face'|'chimney', ...}
        const [numPad, setNumPad] = useState(null);
        const [tplKind, setTplKind] = useState(null);
        const [undoStack, setUndoStack] = useState([]);
        const svgRef = useRef(null);
        const ptrs = useRef(new Map());
        const gesture = useRef(null);

        const setPlan = (newPlan, alsoResetSel) => {
            setUndoStack(st => [...st.slice(-19), plan]);
            update({ plan: newPlan });
            if (alsoResetSel) setSel(null);
        };
        const undo = () => {
            setUndoStack(st => {
                if (!st.length) return st;
                update({ plan: st[st.length - 1] });
                return st.slice(0, -1);
            });
            setSel(null);
        };

        const fitView = (p) => {
            const pl = p || plan;
            if (!pl.vertices.length) { setVb({ x: -2, y: -12, w: 20, h: 14 }); return; }
            const b = Geo.bounds(pl.vertices);
            const pad = Math.max(2, (b.maxX - b.minX) * 0.15);
            const w = (b.maxX - b.minX) + pad * 2;
            const h = (b.maxY - b.minY) + pad * 2;
            setVb({ x: b.minX - pad, y: -b.maxY - pad, w, h: Math.max(h, w * 0.6) });
        };
        useEffect(() => { fitView(); }, []); // la montare

        const applyTemplate = (kind, vals) => {
            const g = kind === '2ape' ? Geo.tpl2Ape(vals.L, vals.W)
                : kind === '4ape' ? Geo.tpl4Ape(vals.L, vals.W)
                : Geo.tplL(vals.L1, vals.W1, vals.L2, vals.W2);
            const newPlan = { ...plan, vertices: g.vertices, edges: g.edges };
            setPlan(newPlan, true);
            setTplKind(null);
            setTimeout(() => fitView(newPlan), 0);
        };

        // conversii coordonate
        const clientToWorld = (ev) => {
            const r = svgRef.current.getBoundingClientRect();
            const sx = vb.x + (ev.clientX - r.left) / r.width * vb.w;
            const sy = vb.y + (ev.clientY - r.top) / r.height * vb.h;
            return { x: sx, y: -sy };
        };
        const px = (p) => ({ x: p.x, y: -p.y });
        const tolWorld = () => vb.w / 500 * 14; // ~14px în unități lume

        // hit-test manual în coordonate lume
        const hitTest = (w) => {
            const tol = tolWorld();
            let best = null, bestD = tol;
            plan.vertices.forEach((v, i) => {
                const d = Math.hypot(v.x - w.x, v.y - w.y);
                if (d < bestD) { bestD = d; best = { type: 'vertex', id: i }; }
            });
            if (best) return best;
            let bestE = null, bestED = tol;
            plan.edges.forEach((e, ei) => {
                const r = nearestOnSegment(w, plan.vertices[e.a], plan.vertices[e.b]);
                if (r.d < bestED) { bestED = r.d; bestE = { type: 'edge', id: ei }; }
            });
            if (bestE) return bestE;
            const ci = plan.chimneys.findIndex(c => Math.abs(w.x - c.x) < c.w / 2 + tol / 2 && Math.abs(w.y - c.y) < c.h / 2 + tol / 2);
            if (ci >= 0) return { type: 'chimney', id: ci };
            const fi = derived.faces.findIndex(f => pointInPoly(w, f.pts));
            if (fi >= 0) return { type: 'face', id: fi };
            return null;
        };

        // gesturi pointer: tap / pan / pinch / drag de vârf
        const onPointerDown = (ev) => {
            ev.target.setPointerCapture && svgRef.current.setPointerCapture(ev.pointerId);
            ptrs.current.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
            if (ptrs.current.size === 2) {
                const [p1, p2] = [...ptrs.current.values()];
                gesture.current = { kind: 'pinch', d0: Math.hypot(p2.x - p1.x, p2.y - p1.y), vb0: vb };
                return;
            }
            const w = clientToWorld(ev);
            const hit = tool === 'select' ? hitTest(w) : null;
            if (hit && hit.type === 'vertex') {
                gesture.current = { kind: 'dragVertex', id: hit.id, moved: false, plan0: plan };
            } else {
                gesture.current = { kind: 'panOrTap', x0: ev.clientX, y0: ev.clientY, vb0: vb, w0: w, moved: false };
            }
        };
        const onPointerMove = (ev) => {
            if (!ptrs.current.has(ev.pointerId)) return;
            ptrs.current.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
            const g = gesture.current;
            if (!g) return;
            if (g.kind === 'pinch' && ptrs.current.size === 2) {
                const [p1, p2] = [...ptrs.current.values()];
                const d = Math.hypot(p2.x - p1.x, p2.y - p1.y);
                const scale = Math.max(0.3, Math.min(3, d / g.d0));
                const cx = g.vb0.x + g.vb0.w / 2, cy = g.vb0.y + g.vb0.h / 2;
                const w = g.vb0.w / scale, h = g.vb0.h / scale;
                setVb({ x: cx - w / 2, y: cy - h / 2, w, h });
                return;
            }
            const r = svgRef.current.getBoundingClientRect();
            if (g.kind === 'dragVertex') {
                const w = clientToWorld(ev);
                const q = { x: snap05(w.x), y: snap05(w.y) };
                g.moved = true;
                const vertices = plan.vertices.map((v, i) => i === g.id ? q : v);
                update({ plan: { ...plan, vertices } });
                return;
            }
            if (g.kind === 'panOrTap') {
                const dx = ev.clientX - g.x0, dy = ev.clientY - g.y0;
                if (Math.hypot(dx, dy) > 8) g.moved = true;
                if (g.moved) {
                    setVb({ ...g.vb0, x: g.vb0.x - dx / r.width * g.vb0.w, y: g.vb0.y - dy / r.height * g.vb0.h });
                }
            }
        };
        const onPointerUp = (ev) => {
            ptrs.current.delete(ev.pointerId);
            const g = gesture.current;
            if (!g) return;
            if (g.kind === 'pinch') { if (ptrs.current.size < 2) gesture.current = null; return; }
            gesture.current = null;
            if (g.kind === 'dragVertex') {
                if (g.moved) setUndoStack(st => [...st.slice(-19), g.plan0]);
                else setSel({ type: 'vertex', id: g.id });
                return;
            }
            if (g.moved) return; // a fost pan
            const w = g.w0;
            // TAP
            if (tool === 'draw') {
                const prev = pending[pending.length - 1];
                if (pending.length >= 3 && Math.hypot(w.x - pending[0].x, w.y - pending[0].y) < tolWorld() * 1.6) {
                    // închidere contur
                    setPlan(addContourToPlan(plan, pending, 0.2), true);
                    setPending([]);
                    setTool('select');
                } else {
                    setPending(ps => [...ps, snapDraw(w, prev)]);
                }
                return;
            }
            if (tool === 'line') {
                if (!lineStart) { setLineStart(snapDraw(w, null)); }
                else {
                    setPlan(addLineToPlan(plan, lineStart, snapDraw(w, lineStart), Math.max(0.25, tolWorld())), true);
                    setLineStart(null);
                }
                return;
            }
            if (tool === 'cos') {
                const q = snapGrid(w, 0.05);
                setPlan({ ...plan, chimneys: [...plan.chimneys, { x: q.x, y: q.y, w: 0.5, h: 0.5 }] });
                return;
            }
            // select
            const hit = hitTest(w);
            setSel(hit);
        };

        // acțiuni pe selecție
        const selEdge = sel && sel.type === 'edge' && plan.edges[sel.id] ? plan.edges[sel.id] : null;
        const selEdgeKey = selEdge ? edgeKeyOf(selEdge, plan.vertices) : null;
        const selEdgeType = selEdge ? (derived.edgeTypes[sel.id] || 'racord') : null;
        const selEdgeLen = selEdge ? Geo.dist(plan.vertices[selEdge.a], plan.vertices[selEdge.b]) : 0;
        const selFace = sel && sel.type === 'face' ? derived.faces[sel.id] : null;

        const setEdgeCote = (len) => {
            // mută capătul B pe direcția A→B ca să obțină lungimea cerută
            const e = selEdge;
            const A = plan.vertices[e.a], B = plan.vertices[e.b];
            const L = Geo.dist(A, B) || 1;
            const q = { x: snap05(A.x + (B.x - A.x) / L * len), y: snap05(A.y + (B.y - A.y) / L * len) };
            setPlan({ ...plan, vertices: plan.vertices.map((v, i) => i === e.b ? q : v) });
        };
        const rotateFlow = () => {
            if (!selFace) return;
            const cur = Math.atan2(selFace.flow.y, selFace.flow.x);
            const next = cur - Math.PI / 4;
            update({ faceOverrides: { ...project.faceOverrides, [selFace.key]: { ...(project.faceOverrides[selFace.key] || {}), flowAngle: next } } });
        };

        // grilă
        const gridLines = useMemo(() => {
            const lines = [];
            const x0 = Math.floor(vb.x), x1 = Math.ceil(vb.x + vb.w);
            const y0 = Math.floor(vb.y), y1 = Math.ceil(vb.y + vb.h);
            for (let x = x0; x <= x1; x++) lines.push({ x1: x, y1: vb.y, x2: x, y2: vb.y + vb.h, major: x % 5 === 0 });
            for (let y = y0; y <= y1; y++) lines.push({ x1: vb.x, y1: y, x2: vb.x + vb.w, y2: y, major: y % 5 === 0 });
            return lines;
        }, [vb]);

        const showCote = vb.w < 45;
        const fontS = vb.w / 55;

        return (
            <div className="space-y-3 animate-in">
                {/* BARA DE UNELTE */}
                <div className="glass rounded-2xl shadow p-2 flex flex-wrap gap-1.5 items-center no-print">
                    <span className="text-[10px] font-bold text-slate-400 uppercase px-1">Șablon:</span>
                    {[['2ape', '2 Ape'], ['4ape', '4 Ape'], ['L', 'În L']].map(([k, lbl]) => (
                        <button key={k} onClick={() => {
                            if (plan.vertices.length && !confirm('Înlocuiești desenul existent cu șablonul?')) return;
                            setTplKind(k);
                        }} className="h-11 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-600">{lbl}</button>
                    ))}
                    <span className="w-px h-8 bg-slate-200 mx-1"></span>
                    {[['select', 'Move', 'Selectează'], ['draw', 'Pencil', 'Contur'], ['line', 'Minus', 'Linie'], ['cos', 'Flame', 'Coș']].map(([k, ic, lbl]) => (
                        <button key={k} onClick={() => { setTool(k); setSel(null); setLineStart(null); if (k !== 'draw') setPending([]); }}
                            className={`h-11 px-3 rounded-xl text-xs font-bold flex items-center gap-1.5 ${tool === k ? 'bg-red-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>
                            <Icon name={ic} size={15}/>{lbl}
                        </button>
                    ))}
                    <span className="w-px h-8 bg-slate-200 mx-1"></span>
                    <button onClick={undo} disabled={!undoStack.length} className="h-11 px-3 rounded-xl bg-slate-100 text-slate-600 disabled:opacity-30"><Icon name="Undo" size={16}/></button>
                    <button onClick={() => fitView()} className="h-11 px-3 rounded-xl bg-slate-100 text-slate-600"><Icon name="Maximize" size={16}/></button>
                    <button onClick={() => { if (confirm('Ștergi tot desenul?')) { setPlan({ ...plan, vertices: [], edges: [], chimneys: [] }, true); setPending([]); } }}
                        className="h-11 px-3 rounded-xl bg-slate-100 text-red-500"><Icon name="Trash2" size={16}/></button>
                    <div className="flex-1"></div>
                    <div className="text-xs text-slate-500 font-bold px-2">
                        {derived.faces.length} versanți · {Geo.round2(derived.faces.reduce((s, f) => s + f.planArea, 0))} m² în plan
                    </div>
                </div>

                {/* indicație pentru unealta curentă */}
                <div className="text-xs text-slate-500 px-2 no-print">
                    {tool === 'draw' && (pending.length === 0 ? 'Atinge colțurile conturului streșinilor. Grilă 0,25 m, unghiuri 45°.' : `${pending.length} puncte — atinge primul punct pentru a închide conturul.`)}
                    {tool === 'line' && (lineStart ? 'Atinge al doilea capăt al liniei (coamă / dolie / muchie).' : 'Atinge primul capăt al liniei interioare. Capetele se lipesc de vârfuri/laturi existente.')}
                    {tool === 'cos' && 'Atinge poziția coșului pe versant.'}
                    {tool === 'select' && 'Atinge o latură (cotă/tip), un vârf (mută/șterge), un versant (sens scurgere) sau un coș.'}
                </div>

                {/* CANVAS */}
                <div className="glass rounded-2xl shadow-lg overflow-hidden relative" style={{ height: '58vh', minHeight: 380 }}>
                    <svg ref={svgRef} className="sketch-svg w-full h-full" viewBox={`${vb.x} ${vb.y} ${vb.w} ${vb.h}`}
                        onPointerDown={onPointerDown} onPointerMove={onPointerMove} onPointerUp={onPointerUp} onPointerCancel={onPointerUp}>
                        {/* grilă */}
                        {gridLines.map((l, i) => (
                            <line key={i} x1={l.x1} y1={l.y1} x2={l.x2} y2={l.y2}
                                stroke={l.major ? '#cbd5e1' : '#e2e8f0'} strokeWidth={vb.w / (l.major ? 700 : 1400)}/>
                        ))}

                        {/* fețe (versanți) */}
                        {derived.faces.map((f, fi) => {
                            const c = Geo.centroid(f.pts);
                            const alen = Math.min(1.6, Math.sqrt(f.planArea) / 3 + 0.5);
                            const tip = { x: c.x + f.flow.x * alen, y: c.y + f.flow.y * alen };
                            const perp = { x: -f.flow.y, y: f.flow.x };
                            return (
                                <g key={f.key}>
                                    <polygon points={f.pts.map(p => `${px(p).x},${px(p).y}`).join(' ')}
                                        fill={FACE_TINTS[fi % FACE_TINTS.length]} fillOpacity={sel && sel.type === 'face' && sel.id === fi ? 0.85 : 0.45} stroke="none"/>
                                    {/* săgeata sensului de scurgere */}
                                    <line x1={px(c).x} y1={px(c).y} x2={px(tip).x} y2={px(tip).y} stroke="#0369a1" strokeWidth={vb.w / 250}/>
                                    <polygon points={`${px(tip).x},${px(tip).y} ${px({ x: tip.x - f.flow.x * 0.35 + perp.x * 0.2, y: tip.y - f.flow.y * 0.35 + perp.y * 0.2 }).x},${px({ x: tip.x - f.flow.x * 0.35 + perp.x * 0.2, y: tip.y - f.flow.y * 0.35 + perp.y * 0.2 }).y} ${px({ x: tip.x - f.flow.x * 0.35 - perp.x * 0.2, y: tip.y - f.flow.y * 0.35 - perp.y * 0.2 }).x},${px({ x: tip.x - f.flow.x * 0.35 - perp.x * 0.2, y: tip.y - f.flow.y * 0.35 - perp.y * 0.2 }).y}`}
                                        fill="#0369a1"/>
                                    <text x={px(c).x} y={px(c).y - fontS * 0.8} textAnchor="middle" fontSize={fontS} fontWeight="bold" fill="#334155">{f.name}</text>
                                    <text x={px(c).x} y={px(c).y + fontS * 1.1} textAnchor="middle" fontSize={fontS * 0.75} fill="#64748b">{f.missingPitch ? f.planArea + ' m² (plan)' : f.realArea + ' m² real'}</text>
                                </g>
                            );
                        })}

                        {/* muchii */}
                        {plan.edges.map((e, ei) => {
                            const A = plan.vertices[e.a], B = plan.vertices[e.b];
                            const t = derived.edgeTypes[ei] || 'racord';
                            const isSel = sel && sel.type === 'edge' && sel.id === ei;
                            const mid = { x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 };
                            const L = Geo.dist(A, B);
                            const nx = -(B.y - A.y) / (L || 1), ny = (B.x - A.x) / (L || 1);
                            return (
                                <g key={ei}>
                                    <line x1={px(A).x} y1={px(A).y} x2={px(B).x} y2={px(B).y}
                                        stroke={isSel ? '#f59e0b' : EDGE_TYPES[t].color}
                                        strokeWidth={vb.w / (isSel ? 90 : 140)}
                                        strokeDasharray={t === 'dolie' ? `${vb.w / 100} ${vb.w / 200}` : 'none'}
                                        strokeLinecap="round"/>
                                    {showCote && L > 0.4 && (
                                        <text x={px({ x: mid.x + nx * 0.45, y: mid.y + ny * 0.45 }).x}
                                            y={px({ x: mid.x + nx * 0.45, y: mid.y + ny * 0.45 }).y}
                                            textAnchor="middle" fontSize={fontS * 0.8} fill="#475569" fontWeight="600">{Geo.round2(L)}</text>
                                    )}
                                </g>
                            );
                        })}

                        {/* vârfuri */}
                        {plan.vertices.map((v, i) => (
                            <circle key={i} cx={px(v).x} cy={px(v).y} r={vb.w / (sel && sel.type === 'vertex' && sel.id === i ? 70 : 120)}
                                fill={sel && sel.type === 'vertex' && sel.id === i ? '#f59e0b' : '#334155'} stroke="white" strokeWidth={vb.w / 500}/>
                        ))}

                        {/* coșuri */}
                        {plan.chimneys.map((c, i) => (
                            <g key={i}>
                                <rect x={c.x - c.w / 2} y={-c.y - c.h / 2} width={c.w} height={c.h}
                                    fill={sel && sel.type === 'chimney' && sel.id === i ? '#f59e0b' : '#78716c'} stroke="#44403c" strokeWidth={vb.w / 600}/>
                                <text x={c.x} y={-c.y - c.h / 2 - fontS * 0.3} textAnchor="middle" fontSize={fontS * 0.7} fill="#57534e" fontWeight="bold">Coș</text>
                            </g>
                        ))}

                        {/* conturul în desenare */}
                        {pending.length > 0 && (
                            <g>
                                <polyline points={pending.map(p => `${px(p).x},${px(p).y}`).join(' ')} fill="none" stroke="#dc2626" strokeWidth={vb.w / 150} strokeDasharray={`${vb.w / 80} ${vb.w / 160}`}/>
                                {pending.map((p, i) => (
                                    <circle key={i} cx={px(p).x} cy={px(p).y} r={i === 0 ? vb.w / 55 : vb.w / 110}
                                        fill={i === 0 ? '#dc2626' : '#f87171'} fillOpacity={i === 0 ? 0.5 : 1} stroke="#dc2626" strokeWidth={vb.w / 400}/>
                                ))}
                                {pending.slice(1).map((p, i) => {
                                    const a = pending[i];
                                    const mid = { x: (a.x + p.x) / 2, y: (a.y + p.y) / 2 };
                                    return <text key={i} x={px(mid).x} y={px(mid).y - fontS * 0.4} textAnchor="middle" fontSize={fontS * 0.85} fill="#dc2626" fontWeight="bold">{Geo.round2(Geo.dist(a, p))}</text>;
                                })}
                            </g>
                        )}
                        {lineStart && <circle cx={px(lineStart).x} cy={px(lineStart).y} r={vb.w / 70} fill="#dc2626" fillOpacity={0.6}/>}
                    </svg>

                    {/* butoane zoom */}
                    <div className="absolute right-3 top-3 flex flex-col gap-1.5 no-print">
                        <button onClick={() => setVb(v => ({ x: v.x + v.w * 0.15, y: v.y + v.h * 0.15, w: v.w * 0.7, h: v.h * 0.7 }))} className="h-11 w-11 rounded-xl bg-white/90 shadow font-bold text-slate-600 text-lg">+</button>
                        <button onClick={() => setVb(v => ({ x: v.x - v.w * 0.21, y: v.y - v.h * 0.21, w: v.w * 1.43, h: v.h * 1.43 }))} className="h-11 w-11 rounded-xl bg-white/90 shadow font-bold text-slate-600 text-lg">−</button>
                    </div>

                    {/* butoane desen contur */}
                    {tool === 'draw' && pending.length >= 3 && (
                        <div className="absolute left-3 bottom-3 flex gap-2 no-print">
                            <button onClick={() => { setPlan(addContourToPlan(plan, pending, 0.2), true); setPending([]); setTool('select'); }}
                                className="h-12 px-4 rounded-xl bg-red-600 text-white font-bold shadow-lg flex items-center gap-2"><Icon name="Check" size={16}/> Închide conturul</button>
                            <button onClick={() => setPending(ps => ps.slice(0, -1))} className="h-12 px-4 rounded-xl bg-white shadow font-bold text-slate-600">Înapoi un punct</button>
                        </div>
                    )}
                </div>

                {/* PANOU CONTEXT SELECȚIE */}
                {sel && sel.type === 'edge' && selEdge && (
                    <Card className="no-print">
                        <div className="flex flex-wrap items-center gap-3">
                            <div className="font-bold text-slate-700 flex items-center gap-2">
                                <span className="h-3 w-3 rounded-full" style={{ background: EDGE_TYPES[selEdgeType].color }}></span>
                                Latură · {Geo.round2(selEdgeLen)} m în plan
                            </div>
                            <button onClick={() => setNumPad({ title: 'Cota laturii (m)', initial: Geo.round2(selEdgeLen), onOk: (v) => { setEdgeCote(v); setNumPad(null); } })}
                                className="h-11 px-4 rounded-xl bg-slate-100 font-bold text-slate-600 flex items-center gap-2"><Icon name="Ruler" size={15}/> Cotă</button>
                            <div className="flex gap-1 flex-wrap">
                                {Object.entries(EDGE_TYPES).map(([k, t]) => (
                                    <button key={k} onClick={() => update({ edgeOverrides: { ...project.edgeOverrides, [selEdgeKey]: k } })}
                                        className={`h-11 px-3 rounded-xl text-xs font-bold border-2 ${selEdgeType === k ? 'text-white' : 'text-slate-600 bg-white'}`}
                                        style={selEdgeType === k ? { background: t.color, borderColor: t.color } : { borderColor: t.color + '55' }}>
                                        {t.label}
                                    </button>
                                ))}
                            </div>
                            <div className="flex-1"></div>
                            <button onClick={() => { setPlan(removeEdgeFromPlan(plan, sel.id), true); }} className="h-11 px-4 rounded-xl bg-red-50 text-red-600 font-bold flex items-center gap-2"><Icon name="Trash2" size={15}/> Șterge</button>
                        </div>
                        <div className="text-[11px] text-slate-400 mt-2">Cota mută capătul mai depărtat al laturii pe direcția ei. Tipul e detectat automat din sensul de scurgere — apasă alt tip doar dacă e greșit.</div>
                    </Card>
                )}
                {sel && sel.type === 'vertex' && (
                    <Card className="no-print flex items-center gap-3">
                        <div className="font-bold text-slate-700">Vârf ({plan.vertices[sel.id] ? `${Geo.round2(plan.vertices[sel.id].x)}, ${Geo.round2(plan.vertices[sel.id].y)}` : ''}) — trage-l ca să-l muți (pas 5 cm)</div>
                        <div className="flex-1"></div>
                        <button onClick={() => { setPlan(removeVertexFromPlan(plan, sel.id), true); }} className="h-11 px-4 rounded-xl bg-red-50 text-red-600 font-bold flex items-center gap-2"><Icon name="Trash2" size={15}/> Șterge vârful</button>
                    </Card>
                )}
                {selFace && (
                    <Card className="no-print">
                        <div className="flex flex-wrap items-center gap-3">
                            <div className="font-bold text-slate-700">{selFace.name} · {selFace.planArea} m² în plan</div>
                            <button onClick={rotateFlow} className="h-11 px-4 rounded-xl bg-sky-50 text-sky-700 font-bold flex items-center gap-2"><Icon name="RefreshCw" size={15}/> Rotește scurgerea 45°</button>
                            <button onClick={() => {
                                const name = prompt('Numele versantului:', selFace.name);
                                if (name) update({ faceOverrides: { ...project.faceOverrides, [selFace.key]: { ...(project.faceOverrides[selFace.key] || {}), name } } });
                            }} className="h-11 px-4 rounded-xl bg-slate-100 text-slate-600 font-bold">Redenumește</button>
                            <div className="text-xs text-slate-400">Lungimea pantei se introduce în ecranul „Versanți".</div>
                        </div>
                    </Card>
                )}
                {sel && sel.type === 'chimney' && plan.chimneys[sel.id] && (
                    <Card className="no-print flex flex-wrap items-center gap-3">
                        <div className="font-bold text-slate-700">Coș · {plan.chimneys[sel.id].w}×{plan.chimneys[sel.id].h} m</div>
                        <button onClick={() => setNumPad({ title: 'Lățime coș (m)', initial: plan.chimneys[sel.id].w, onOk: (v) => { setPlan({ ...plan, chimneys: plan.chimneys.map((c, i) => i === sel.id ? { ...c, w: v } : c) }); setNumPad(null); } })}
                            className="h-11 px-4 rounded-xl bg-slate-100 font-bold text-slate-600">Lățime</button>
                        <button onClick={() => setNumPad({ title: 'Adâncime coș (m)', initial: plan.chimneys[sel.id].h, onOk: (v) => { setPlan({ ...plan, chimneys: plan.chimneys.map((c, i) => i === sel.id ? { ...c, h: v } : c) }); setNumPad(null); } })}
                            className="h-11 px-4 rounded-xl bg-slate-100 font-bold text-slate-600">Adâncime</button>
                        <div className="flex-1"></div>
                        <button onClick={() => { setPlan({ ...plan, chimneys: plan.chimneys.filter((_, i) => i !== sel.id) }, true); }} className="h-11 px-4 rounded-xl bg-red-50 text-red-600 font-bold flex items-center gap-2"><Icon name="Trash2" size={15}/> Șterge</button>
                    </Card>
                )}

                {/* legendă */}
                <div className="flex flex-wrap gap-3 px-2 text-[11px] font-bold text-slate-500 no-print">
                    {Object.entries(EDGE_TYPES).map(([k, t]) => (
                        <span key={k} className="flex items-center gap-1.5"><span className="h-2.5 w-6 rounded" style={{ background: t.color }}></span>{t.label}</span>
                    ))}
                </div>

                {numPad && <NumPad title={numPad.title} initial={numPad.initial} onOk={numPad.onOk} onCancel={() => setNumPad(null)}/>}
                {tplKind && <TplModal kind={tplKind} onOk={(vals) => applyTemplate(tplKind, vals)} onCancel={() => setTplKind(null)}/>}
            </div>
        );
    };

    const ScreenVersanti = ({ project, update, derived }) => (
        <Card className="text-center py-16 text-slate-400">
            <Icon name="Layers" size={40} className="mx-auto mb-3 opacity-40"/>
            <div className="font-bold">Versanți — în construcție</div>
        </Card>
    );

    const ScreenPanotaj = ({ project, update, derived }) => (
        <Card className="text-center py-16 text-slate-400">
            <Icon name="Grid" size={40} className="mx-auto mb-3 opacity-40"/>
            <div className="font-bold">Panotaj — în construcție</div>
        </Card>
    );

    const ScreenNecesar = ({ project, update, derived }) => (
        <Card className="text-center py-16 text-slate-400">
            <Icon name="Package" size={40} className="mx-auto mb-3 opacity-40"/>
            <div className="font-bold">Necesar — în construcție</div>
        </Card>
    );

    const ScreenOferta = ({ project, update, derived, settings, setSettings }) => (
        <Card className="text-center py-16 text-slate-400">
            <Icon name="FileText" size={40} className="mx-auto mb-3 opacity-40"/>
            <div className="font-bold">Ofertă — în construcție</div>
        </Card>
    );

    // ============================================
    // APP
    // ============================================
    const TABS = [
        { id: 'proiecte', label: 'Proiecte', icon: 'Home' },
        { id: 'client', label: 'Client', icon: 'User' },
        { id: 'plan', label: 'Plan', icon: 'Pencil' },
        { id: 'versanti', label: 'Versanți', icon: 'Layers' },
        { id: 'panotaj', label: 'Panotaj', icon: 'Grid' },
        { id: 'necesar', label: 'Necesar', icon: 'Package' },
        { id: 'oferta', label: 'Ofertă', icon: 'FileText' }
    ];

    const App = () => {
        const [settings, setSettings] = useState(() => loadLS(LS_SETTINGS, {
            agent: { name: 'Daniel Neacșu', phone: '0722 000 000', company: 'PeAcoperis.ro', email: 'oferta@peacoperis.com' },
            ghostMargins: { 'Bilka': 0, 'Caretta': 0, 'TPS': 0, 'Arkada': 0 },
            adminUnlocked: false, showCost: false, quoteValidity: 15
        }));
        const [projects, setProjects] = useState(() => loadLS(LS_PROJECTS, {}));
        const [project, setProject] = useState(null);
        const [screen, setScreen] = useState('proiecte');
        const [saveFlash, setSaveFlash] = useState(false);

        // autosave cu debounce
        useEffect(() => {
            if (!project) return;
            const t = setTimeout(() => {
                setProjects(prev => {
                    const next = { ...prev, [project.id]: { ...project, updatedAt: new Date().toISOString() } };
                    if (!saveLS(LS_PROJECTS, next)) console.warn('localStorage plin — exportă proiectele în JSON');
                    return next;
                });
                setSaveFlash(true);
                setTimeout(() => setSaveFlash(false), 800);
            }, 500);
            return () => clearTimeout(t);
        }, [project]);

        useEffect(() => { saveLS(LS_SETTINGS, settings); }, [settings]);

        const update = useCallback((patch) => setProject(p => ({ ...p, ...patch })), []);
        const derived = useMemo(() => project ? computeDerived(project) : { faces: [], ready: false }, [project]);

        const openProject = (id) => { setProject(projects[id]); setScreen(projects[id].plan.vertices.length ? 'plan' : 'client'); };
        const createProject = () => { const p = newProject(); setProject(p); setScreen('client'); };
        const deleteProject = (id) => {
            setProjects(prev => { const n = { ...prev }; delete n[id]; saveLS(LS_PROJECTS, n); return n; });
            if (project && project.id === id) { setProject(null); setScreen('proiecte'); }
        };
        const duplicateProject = (id) => {
            const src = projects[id];
            const cp = { ...JSON.parse(JSON.stringify(src)), id: uid(), name: (src.name || 'Proiect') + ' (copie)', createdAt: new Date().toISOString() };
            setProjects(prev => { const n = { ...prev, [cp.id]: cp }; saveLS(LS_PROJECTS, n); return n; });
        };
        const importProject = (data) => {
            const p = { ...newProject(), ...data, id: uid() };
            setProjects(prev => { const n = { ...prev, [p.id]: p }; saveLS(LS_PROJECTS, n); return n; });
        };
        const exportProject = () => {
            if (!project) return;
            const blob = new Blob([JSON.stringify(project, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `Proiect_${(project.name || project.client.name || 'acoperis').replace(/\s+/g, '_')}.json`;
            a.click();
        };

        // starea de completare pentru bifele din tab bar
        const done = {
            client: project && (project.client.name || '').length > 0,
            plan: derived.ready,
            versanti: derived.ready && !derived.missingPitch,
            panotaj: derived.ready && !derived.missingPitch
        };

        const screens = {
            proiecte: <ScreenProiecte projects={projects} openProject={openProject} createProject={createProject}
                deleteProject={deleteProject} duplicateProject={duplicateProject} importProject={importProject}/>,
            client: project && <ScreenClient project={project} update={update}/>,
            plan: project && <ScreenPlan project={project} update={update} derived={derived}/>,
            versanti: project && <ScreenVersanti project={project} update={update} derived={derived}/>,
            panotaj: project && <ScreenPanotaj project={project} update={update} derived={derived}/>,
            necesar: project && <ScreenNecesar project={project} update={update} derived={derived}/>,
            oferta: project && <ScreenOferta project={project} update={update} derived={derived} settings={settings} setSettings={setSettings}/>
        };

        return (
            <div className="max-w-5xl mx-auto min-h-screen p-3 pb-28">
                {/* HEADER */}
                <header className="glass p-3 rounded-2xl shadow-lg border border-white/50 mb-4 flex items-center justify-between no-print">
                    <div className="flex items-center gap-3">
                        <div className="h-11 w-11 gradient-header text-white flex items-center justify-center rounded-xl font-bold shadow-lg">PA</div>
                        <div>
                            <h1 className="font-bold text-slate-800 leading-tight">{settings.agent.company} · Schiță Acoperiș</h1>
                            <div className="text-xs text-slate-500">
                                {project ? (project.name || project.client.name || 'Proiect nou') : 'Alege sau creează un proiect'}
                                {saveFlash && <span className="ml-2 text-green-600 font-bold">✓ salvat</span>}
                            </div>
                        </div>
                    </div>
                    {project && (
                        <div className="flex gap-2">
                            <button onClick={exportProject} className="p-2.5 rounded-lg bg-slate-100 text-slate-500" title="Export JSON"><Icon name="Download" size={18}/></button>
                            <button onClick={() => { setProject(null); setScreen('proiecte'); }} className="p-2.5 rounded-lg bg-slate-100 text-slate-500" title="Închide proiectul"><Icon name="X" size={18}/></button>
                        </div>
                    )}
                </header>

                {screens[screen] || screens.proiecte}

                {/* TAB BAR */}
                <nav className="fixed bottom-0 left-0 right-0 z-40 no-print">
                    <div className="max-w-5xl mx-auto p-2">
                        <div className="glass rounded-2xl shadow-2xl border border-white/50 flex overflow-x-auto">
                            {TABS.map(t => {
                                const disabled = t.id !== 'proiecte' && !project;
                                return (
                                    <button key={t.id} disabled={disabled}
                                        onClick={() => setScreen(t.id)}
                                        className={`flex-1 min-w-[64px] py-2.5 flex flex-col items-center gap-0.5 rounded-xl m-1 text-[11px] font-bold transition
                                            ${screen === t.id ? 'tab-active shadow-lg' : disabled ? 'text-slate-300' : 'text-slate-500 hover:bg-slate-100'}`}>
                                        <div className="relative">
                                            <Icon name={t.icon} size={20}/>
                                            {done[t.id] && screen !== t.id && <span className="absolute -top-1 -right-2 text-green-500"><Icon name="CheckCircle" size={11}/></span>}
                                        </div>
                                        {t.label}
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                </nav>
            </div>
        );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
