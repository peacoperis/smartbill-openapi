    // ============================================

    // Marjele Invest Tetto si moneda per furnizor

        'Bilka': { margin: 6.98, currency: 'EUR', exchange: 4.97, minLen: 0.5, maxLen: 2.5 },

        'Arkada': { margin: 10.00, currency: 'RON', minLen: 0.5, maxLen: 6.0 }
    };

    // Baza de date Modele (FIXA - Nu dispare nimic din lista)
    const MODELS_DB = [
        { id: 'y109', name: 'Y109', provider: 'Caretta', w_useful: 72, fixType: 'screw', screwsPerM: 6 },
        { id: 'y112', name: 'Y112', provider: 'Caretta', w_useful: 90, fixType: 'screw', screwsPerM: 6 },
        { id: 'y115', name: 'Y115', provider: 'Caretta', w_useful: 118, fixType: 'screw', screwsPerM: 6 },
        { id: 'y118', name: 'Y118', provider: 'Caretta', w_useful: 118, fixType: 'screw', screwsPerM: 6 },
        { id: 'sofia', name: 'Sofia', provider: 'Bilka', w_useful: 115, fixType: 'screw', screwsPerM: 6 },
        { id: 'berna', name: 'Berna', provider: 'Bilka', w_useful: 105, fixType: 'screw', screwsPerM: 6 },
        { id: 'oslo', name: 'Oslo', provider: 'Bilka', w_useful: 115, fixType: 'screw', screwsPerM: 6 },
        { id: 'tisa', name: 'Tisa', provider: 'TPS', w_useful: 115, fixType: 'rivet', rivetsPerM: 8 },
        { id: 'canadiana', name: 'Canadiana', provider: 'Arkada', w_useful: 107, fixType: 'screw', screwsPerM: 6 },
        { id: 'indiana', name: 'Indiana', provider: 'Arkada', w_useful: 96, fixType: 'rivet', rivetsPerM: 8 }
    ];

    // Matricea de Preturi si Configurare (Reguli Stricte per Furnizor)
    const CATALOG_DATA = {
        'Caretta': {
            '0.40': {
                'Lucios': { price: 5.8, paintType: 'single', colors: ['3005', '3011', '8017', '9005'] }
            },
            '0.50': {
                'Mat': { price: 7.5, paintType: 'single', colors: ['3005', '8017', '8019', '9005', '7024'] },
                'Dublu Mat': { price: 9.8, paintType: 'double', colors: ['8017', '8019', '9005'] }
            },
            '0.60': {
                'Mat': { price: 9.2, paintType: 'single', colors: ['8017', '9005'] },
                'Dublu Mat': { price: 11.5, paintType: 'double', colors: ['8017', '9005'] }
            }
        },
        'Bilka': {
            '0.40': {
                'Lucios': { price: 0.81, paintType: 'single', colors: ['3005', '3011', '8017', '9005'] }
            },
            '0.45': {
                'Lucios': { price: 0.92, paintType: 'single', colors: ['8017', '3005'] },
                'Mat': { price: 0.98, paintType: 'single', colors: ['8017', '8019', '7024'] }
            },
            '0.50': {
                'Lucios': { price: 0.96, paintType: 'single', colors: ['3005', '8017'] },
                'Mat': { price: 1.05, paintType: 'single', colors: ['3005', '8017', '8019', '9005', '7024'] },
                'GrandeMat': { price: 1.15, paintType: 'single', colors: ['8017', '9005'] },
                'Wood': { price: 1.24, paintType: 'single', colors: ['Stejar Auriu', 'Nuc'] },
                'Dublu Mat': { price: 1.35, paintType: 'double', colors: ['8017', '9005'] }
            },
            '0.60': {
                'Dublu Mat': { price: 1.52, paintType: 'double', colors: ['8017', '9005'] }
            }
        },
        'TPS': {
            '0.45': {
                'Mat': { price: 6.22, paintType: 'single', colors: ['8017', '9005', '7024'] }
            },
            '0.50': {
                'Mat': { price: 7.26, paintType: 'single', colors: ['8017', '9005', '7024'] },

            }
        },
        'Arkada': {
            '0.50': {
                'Mat': { price: 5.82, paintType: 'single', colors: ['8017', '3005', '7024'] },
                'Dublu Mat': { price: 7.31, paintType: 'double', colors: ['8017', '9005'] }
            }

    // Coduri HEX pentru culorile RAL
    const RAL_COLORS = {
        '3005': { hex: '#5E1224', name: 'Vișiniu' },
        '3011': { hex: '#792423', name: 'Roșu Maro' },
        '7024': { hex: '#45494E', name: 'Gri Grafit' },
        '8017': { hex: '#44322D', name: 'Maro Ciocolată' },
        '8019': { hex: '#3D3D3D', name: 'Gri Maro' },
        '9005': { hex: '#0A0A0A', name: 'Negru Profund' },
        'Stejar Auriu': { hex: '#C4A35A', name: 'Stejar Auriu', pattern: true },
        'Nuc': { hex: '#5C4033', name: 'Nuc', pattern: true }
    };

    // Preturi Accesorii
    const ACCESSORIES = {
        screw: { label: 'Șuruburi Autoforante', unit: 'cutie (250 buc)', priceRON: 45, qtyPerBox: 250 },
        rivet: { label: 'Pop-nituri 4.8x12', unit: 'buc', priceRON: 0.25, qtyPerBox: 1 }
    };

    // ============================================
    // MAIN APPLICATION
    // ============================================
    const App = () => {
        // --- AGENT & PARTNER STATE ---
        const [agent, setAgent] = useState({
            name: 'Daniel Neacșu',
            phone: '0722 000 000',
            company: 'PeAcoperis.ro',
            email: 'contact@peacoperis.ro'
        });
        const [ghostMargins, setGhostMargins] = useState({
            'Caretta': 0, 'Bilka': 0, 'TPS': 0, 'Arkada': 0
        });
        const [showAdminPanel, setShowAdminPanel] = useState(false);
        const [showPartnerPanel, setShowPartnerPanel] = useState(false);
        const [adminUnlocked, setAdminUnlocked] = useState(false);

        // Admin settings
        const [adminSettings, setAdminSettings] = useState({
            showCostPrice: false,
            defaultVAT: 19,
            quoteValidity: 7,
            companyLogo: ''
        });

        // --- CLIENT DATA ---
        const [client, setClient] = useState({
            name: '',
            phone: '',
            location: '',
            email: '',
            date: new Date().toLocaleDateString('ro-RO')
        });

        // --- CONFIGURATOR FILTERS (CASCADE) ---
        const [filterPaintType, setFilterPaintType] = useState('any'); // any, single, double
        const [filterThickness, setFilterThickness] = useState('');
        const [filterFinish, setFilterFinish] = useState('');
        const [filterColor, setFilterColor] = useState('');

        // --- DIMENSIONS & CALCULATION MODE ---
        const [calcMode, setCalcMode] = useState('segments'); // segments | direct
        const [mountType, setMountType] = useState('vertical'); // vertical | horizontal
        const [segments, setSegments] = useState([{ id: 1, length: 20, height: 1.65 }]);
        const [gap, setGap] = useState(2); // cm
        const [directQty, setDirectQty] = useState({ pcs: 100, length: 1.5 });

        // --- ACCESSORIES ---
        const [includeAccessories, setIncludeAccessories] = useState(true);

        // --- SELECTED MODEL FOR QUOTE ---
        const [selectedModel, setSelectedModel] = useState(null);

        // --- UI STATE ---
        const [sortOrder, setSortOrder] = useState('priceAsc');
        const [expandedRows, setExpandedRows] = useState({});
        const pdfRef = useRef(null);

        // ============================================
        // CASCADING FILTER LOGIC
        // ============================================

        // Grosimi disponibile (toate)
        const availableThicknesses = useMemo(() => {
            const thicks = new Set();
            Object.values(CATALOG_DATA).forEach(provider => {
                Object.keys(provider).forEach(t => thicks.add(t));
            });
            return Array.from(thicks).sort((a, b) => parseFloat(a) - parseFloat(b));
        }, []);

        // Finisaje disponibile (filtrate dupa paintType SI thickness)
        const availableFinishes = useMemo(() => {
            const finishes = new Set();
            Object.values(CATALOG_DATA).forEach(provider => {
                Object.entries(provider).forEach(([thickness, finishMap]) => {
                    // Filtru grosime daca e selectata
                    if (filterThickness && thickness !== filterThickness) return;

                    Object.entries(finishMap).forEach(([finishName, spec]) => {
                        // Filtru tip vopsire
                        if (filterPaintType === 'double' && spec.paintType !== 'double') return;
                        if (filterPaintType === 'single' && spec.paintType !== 'single') return;
                        finishes.add(finishName);
                    });
                });
            });
            return Array.from(finishes).sort();
        }, [filterPaintType, filterThickness]);

        // Culori disponibile (filtrate dupa thickness + finish)
        const availableColors = useMemo(() => {
            if (!filterThickness || !filterFinish) return [];
            const colors = new Set();
            Object.values(CATALOG_DATA).forEach(provider => {
                const spec = provider[filterThickness]?.[filterFinish];
                if (spec) {
                    spec.colors.forEach(c => colors.add(c));
                }
            });
            return Array.from(colors);
        }, [filterThickness, filterFinish]);

        // Reset cascade when parent changes
        useEffect(() => {
            if (!availableFinishes.includes(filterFinish)) {
                setFilterFinish('');
                setFilterColor('');
            }
        }, [availableFinishes, filterFinish]);

        useEffect(() => {
            if (!availableColors.includes(filterColor)) {
                setFilterColor('');
            }
        }, [availableColors, filterColor]);

        // ============================================
        // CALCULATION ENGINE
        // ============================================
        const processedResults = useMemo(() => {
            const results = [];
            const maxHeight = Math.max(...segments.map(s => s.height), directQty.length);

            MODELS_DB.forEach(model => {
                let status = 'available';
                let failReasons = [];
                let priceTotal = 0;
                let costTotal = 0;
                let details = [];
                let totalPieces = 0;
                let totalLength = 0;
                let accessoriesData = { screws: 0, rivets: 0, screwBoxes: 0 };

                const providerMeta = PROVIDERS[model.provider];
                const providerData = CATALOG_DATA[model.provider];

                // 1. Verificare configuratie existenta
                const spec = providerData?.[filterThickness]?.[filterFinish];

                if (!filterThickness || !filterFinish) {
                    status = 'incomplete';
                    failReasons.push('Selectează configurația');
                } else if (!spec) {
                    status = 'unavailable';
                    failReasons.push(`Fără ${filterFinish} ${filterThickness}mm`);
                } else if (filterColor && !spec.colors.includes(filterColor)) {
                    status = 'unavailable';
                    failReasons.push(`Fără culoare ${filterColor}`);
                }

                // 2. Verificare restrictii lungime (Bilka max 2.5m)
                if (status === 'available' || status === 'incomplete') {
                    if (calcMode === 'segments') {
                        const tooLong = segments.some(s =>
                            (mountType === 'vertical' && s.height > providerMeta.maxLen) ||
                            (mountType === 'horizontal' && s.length > providerMeta.maxLen)
                        );
                        if (tooLong) {
                            status = 'unavailable';
                            failReasons.push(`Max ${providerMeta.maxLen}m lungime`);
                        }
                    } else {
                        if (directQty.length > providerMeta.maxLen) {
                            status = 'unavailable';
                            failReasons.push(`Max ${providerMeta.maxLen}m lungime`);
                        }
                    }
                }

                // 3. Calcul daca e disponibil
                if (status === 'available' && spec) {
                    const widthMm = model.w_useful;
                    const gapMm = gap * 10;

                    // Pret baza (convertit in RON daca e EUR)
                    let rawPrice = spec.price;
                    if (providerMeta.currency === 'EUR') {
                        rawPrice *= providerMeta.exchange;
                    }

                    // Pret cost (cu marja ITC)
                    const costPrice = rawPrice * (1 + providerMeta.margin / 100);

                    // Pret vanzare (cu ghost margin partener)
                    const sellPrice = costPrice * (1 + (ghostMargins[model.provider] || 0) / 100);

                    if (calcMode === 'direct') {
                        // Mod cantitate directa
                        totalPieces = parseInt(directQty.pcs) || 0;
                        totalLength = parseFloat(directQty.length) || 0;
                        priceTotal = totalPieces * sellPrice * totalLength;
                        costTotal = totalPieces * costPrice * totalLength;
                        details.push({
                            label: `${totalPieces} buc x ${totalLength}m`,
                            pcs: totalPieces,
                            length: totalLength,
                            priceUnit: sellPrice,
                            priceTotal: priceTotal
                        });
                    } else {
                        // Mod segmente
                        segments.forEach((seg, idx) => {
                            if (!seg.length || !seg.height) return;

                            let pcs, len;
                            if (mountType === 'vertical') {
                                // Vertical: sipcile se monteaza vertical, calculam cate incap pe lungime
                                pcs = Math.ceil((seg.length * 1000) / (widthMm + gapMm));
                                len = seg.height;
                            } else {
                                // Orizontal: sipcile se monteaza orizontal, calculam cate incap pe inaltime
                                pcs = Math.ceil((seg.height * 1000) / (widthMm + gapMm));
                                len = seg.length;
                            }

                            const segCost = pcs * costPrice * len;
                            const segPrice = pcs * sellPrice * len;
                            totalPieces += pcs;
                            totalLength += pcs * len;
                            costTotal += segCost;
                            priceTotal += segPrice;

                            details.push({
                                label: `Segment ${idx + 1}: ${seg.length}m x ${seg.height}m`,
                                pcs: pcs,
                                length: len,
                                priceUnit: sellPrice * len,
                                priceTotal: segPrice
                            });
                        });
                    }

                    // Calcul accesorii
                    if (model.fixType === 'screw') {
                        const totalScrews = Math.ceil(totalPieces * (model.screwsPerM || 6) * 2); // 2 randuri de prindere
                        accessoriesData.screws = totalScrews;
                        accessoriesData.screwBoxes = Math.ceil(totalScrews / 250);
                    } else {
                        const totalRivets = Math.ceil(totalPieces * (model.rivetsPerM || 8) * 2);
                        accessoriesData.rivets = totalRivets;
                    }
                }

                results.push({
                    model,
                    status,
                    failReasons,
                    priceTotal,
                    costTotal,
                    totalPieces,
                    totalLength,
                    details,
                    accessories: accessoriesData,
                    pricePerPiece: totalPieces > 0 ? priceTotal / totalPieces : 0
                });
            });

            // Sortare
            return results.sort((a, b) => {
                // Disponibile sus, indisponibile jos
                if (a.status === 'unavailable' && b.status !== 'unavailable') return 1;
                if (a.status !== 'unavailable' && b.status === 'unavailable') return -1;
                if (a.status === 'incomplete' && b.status === 'available') return 1;
                if (a.status === 'available' && b.status === 'incomplete') return -1;

                // Sortare pret
                if (sortOrder === 'priceAsc') return a.priceTotal - b.priceTotal;
                return b.priceTotal - a.priceTotal;
            });

                                                {segments.length > 1 && (
                                                    <button
                                                        onClick={() => removeSegment(seg.id)}
                                                        className="text-slate-300 hover:text-red-500 p-1"
                                                    >
                                                        <Icon name="Trash2" size={16}/>
                                                    </button>
                                                )}
                                            </div>
                                        ))}
                                    </div>

                                    {segments.length < 10 && (
                                        <button
                                            onClick={addSegment}
                                            className="w-full mt-3 py-3 border-2 border-dashed border-slate-300 rounded-xl text-slate-400 text-xs font-bold hover:border-red-400 hover:text-red-500 flex items-center justify-center gap-2 transition"
                                        >
                                            <Icon name="Plus" size={14}/> Adaugă Segment
                                        </button>
                                    )}
                                </>
                            ) : (
                                /* Mod Direct */
                                <div className="space-y-4">
                                    <div className="bg-yellow-50 border border-yellow-200 p-3 rounded-xl">
                                        <p className="text-xs text-yellow-700">
                                            <Icon name="Info" size={12} className="inline mr-1"/>
                                            Introdu direct cantitatea de șipci dacă știi exact ce ai nevoie.
                                        </p>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-500 uppercase block mb-2">Nr. Bucăți</label>
                                            <input
                                                type="number"
                                                value={directQty.pcs || ''}
                                                onChange={e => setDirectQty({...directQty, pcs: parseInt(e.target.value) || 0})}
                                                className="w-full border-2 border-slate-200 p-3 rounded-xl font-bold text-lg text-center focus:ring-2 focus:ring-red-500"
                                                placeholder="100"
                                            />
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-500 uppercase block mb-2">Lungime/buc (m)</label>
                                            <input
                                                type="number"
                                                value={directQty.length || ''}
                                                onChange={e => setDirectQty({...directQty, length: parseFloat(e.target.value) || 0})}
                                                className="w-full border-2 border-slate-200 p-3 rounded-xl font-bold text-lg text-center focus:ring-2 focus:ring-red-500"
                                                placeholder="1.5"
                                                step="0.1"
                                            />
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* Accesorii Toggle */}
                            <div className="mt-4 pt-4 border-t">
                                <label className="flex items-center gap-3 cursor-pointer">
                                    <input
                                        type="checkbox"
                                        checked={includeAccessories}
                                        onChange={e => setIncludeAccessories(e.target.checked)}
                                        className="w-5 h-5 rounded border-slate-300 text-red-600 focus:ring-red-500"
                                    />
                                    <span className="text-sm font-bold text-slate-600">Calculează și accesorii (șuruburi/nituri)</span>
                                </label>
                            </div>
                        </div>

                        {/* QUICK RESULT CARD */}
                        {quickStats && (
                            <div className="bg-gradient-to-br from-green-500 to-emerald-600 text-white p-5 rounded-2xl shadow-xl animate-in">
                                <div className="flex items-center gap-2 mb-3">
                                    <Icon name="Zap" size={20}/>
                                    <h3 className="font-bold">Rezultat Rapid</h3>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <div className="text-green-100 text-xs uppercase">Cel mai ieftin</div>
                                        <div className="font-bold text-lg">{quickStats.cheapestModel}</div>
                                        <div className="text-green-200 text-xs">{quickStats.cheapestProvider}</div>
                                    </div>
                                    <div className="text-right">
                                        <div className="text-green-100 text-xs uppercase">Total</div>
                                        <div className="font-bold text-2xl">{quickStats.totalPrice.toFixed(2)} RON</div>
                                        <div className="text-green-200 text-xs">{quickStats.totalPieces} bucăți</div>
                                    </div>
                                </div>
                                <div className="mt-3 pt-3 border-t border-green-400/30 flex justify-between text-sm">
                                    <span className="text-green-100">{quickStats.modelCount} modele disponibile</span>
                                    <span className="font-bold">{quickStats.pricePerPiece.toFixed(2)} RON/buc</span>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* ============ RIGHT PANEL - RESULTS ============ */}
                    <div className="lg:col-span-8">
                        <div className="glass rounded-2xl shadow-xl border border-white/50 flex flex-col h-full overflow-hidden">
                            {/* Toolbar */}
                            <div className="bg-slate-50 p-4 border-b flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 no-print">
                                <div>
                                    <h2 className="font-bold text-slate-800 text-lg">Lista Modele</h2>
                                    <p className="text-xs text-slate-500">
                                        {processedResults.filter(r => r.status === 'available').length} disponibile / {processedResults.length} total
                                    </p>
                                </div>
                                <div className="flex gap-2">
                                    <button
                                        onClick={() => setSortOrder('priceAsc')}
                                        className={`px-3 py-1.5 text-xs font-bold rounded-lg border transition ${
                                            sortOrder === 'priceAsc'
                                                ? 'bg-red-50 text-red-600 border-red-200'
                                                : 'bg-white text-slate-500 border-slate-200'
                                        }`}
                                    >
                                        Preț ↑
                                    </button>
                                    <button
                                        onClick={() => setSortOrder('priceDesc')}
                                        className={`px-3 py-1.5 text-xs font-bold rounded-lg border transition ${
                                            sortOrder === 'priceDesc'
                                                ? 'bg-red-50 text-red-600 border-red-200'
                                                : 'bg-white text-slate-500 border-slate-200'
                                        }`}
                                    >
                                        Preț ↓
                                    </button>
                                </div>
                            </div>

                            {/* Results Table */}
                            <div className="flex-1 overflow-auto">
                                <table className="w-full text-sm text-left">
                                    <thead className="bg-slate-100 text-slate-500 text-xs uppercase font-bold sticky top-0 z-10">
                                        <tr>
                                            <th className="py-3 px-4">Model</th>
                                            <th className="py-3 px-4">Status</th>
                                            <th className="py-3 px-4 text-center">Cantitate</th>
                                            {adminSettings.showCostPrice && adminUnlocked && (
                                                <th className="py-3 px-4 text-right">Cost</th>
                                            )}
                                            <th className="py-3 px-4 text-right">Total (RON)</th>
                                            <th className="py-3 px-4 text-center no-print">Acțiune</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {processedResults.map((res) => (
                                            <React.Fragment key={res.model.id}>
                                                <tr
                                                    className={`group transition cursor-pointer ${
                                                        res.status === 'unavailable'
                                                            ? 'bg-slate-50/50'
                                                            : res.status === 'incomplete'
                                                                ? 'bg-yellow-50/50'
                                                                : selectedModel?.model.id === res.model.id
                                                                    ? 'bg-green-50'
                                                                    : 'hover:bg-slate-50'
                                                    }`}
                                                    onClick={() => res.status === 'available' && toggleRowExpand(res.model.id)}
                                                >
                                                    <td className={`py-4 px-4 ${res.status === 'unavailable' ? 'opacity-50' : ''}`}>
                                                        <div className={`font-bold text-slate-800 ${res.status === 'unavailable' ? 'line-through' : ''}`}>
                                                            {res.model.name}
                                                        </div>
                                                        <div className="text-[10px] uppercase text-slate-400 font-bold flex items-center gap-2">
                                                            {res.model.provider}
                                                            <span className="text-slate-300">•</span>
                                                            <span>{res.model.w_useful}mm</span>
                                                        </div>
                                                    </td>
                                                    <td className="py-4 px-4">
                                                        {res.status === 'available' ? (
                                                            <div className="flex items-center gap-1 text-green-600 font-bold text-xs">
                                                                <Icon name="CheckCircle" size={14}/> Disponibil
                                                            </div>
                                                        ) : res.status === 'incomplete' ? (
                                                            <div className="flex items-center gap-1 text-yellow-600 font-bold text-xs">
                                                                <Icon name="AlertCircle" size={14}/> Incomplet
                                                            </div>
                                                        ) : (
                                                            <div className="text-red-500 text-xs">
                                                                <div className="flex items-center gap-1 font-bold">
                                                                    <Icon name="XCircle" size={14}/> INDISPONIBIL
                                                                </div>
                                                                <div className="text-[10px] text-red-400 mt-0.5">
                                                                    {res.failReasons.join(', ')}
                                                                </div>
                                                            </div>
                                                        )}
                                                    </td>
                                                    <td className="py-4 px-4 text-center">
                                                        {res.status === 'available' ? (
                                                            <div>
                                                                <div className="font-bold text-slate-800">{res.totalPieces} buc</div>
                                                                <div className="text-[10px] text-slate-400">{res.totalLength.toFixed(1)} ml</div>
                                                            </div>
                                                        ) : (
                                                            <span className="text-slate-300">-</span>
                                                        )}
                                                    </td>
                                                    {adminSettings.showCostPrice && adminUnlocked && (
                                                        <td className="py-4 px-4 text-right">
                                                            {res.status === 'available' ? (
                                                                <div className="text-orange-600 font-mono text-sm">
                                                                    {res.costTotal.toFixed(2)}
                                                                </div>
                                                            ) : (
                                                                <span className="text-slate-300">-</span>
                                                            )}
                                                        </td>
                                                    )}
                                                    <td className="py-4 px-4 text-right">
                                                        {res.status === 'available' ? (
                                                            <div>
                                                                <div className="font-bold text-xl text-slate-900">
                                                                    {res.priceTotal.toFixed(2)}
                                                                </div>
                                                                <div className="text-[10px] text-slate-400">
                                                                    {res.pricePerPiece.toFixed(2)} /buc
                                                                </div>
                                                            </div>
                                                        ) : (
                                                            <span className="text-slate-300 font-bold">0.00</span>
                                                        )}
                                                    </td>
                                                    <td className="py-4 px-4 text-center no-print">
                                                        {res.status === 'available' && (
                                                            <button
                                                                onClick={(e) => {
                                                                    e.stopPropagation();
                                                                    selectForQuote(res);
                                                                }}
                                                                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${
                                                                    selectedModel?.model.id === res.model.id
                                                                        ? 'bg-green-600 text-white'
                                                                        : 'bg-red-600 text-white hover:bg-red-700'
                                                                }`}
                                                            >
                                                                {selectedModel?.model.id === res.model.id ? '✓ Selectat' : 'Selectează'}
                                                            </button>
                                                        )}
                                                    </td>
                                                </tr>

                                                {/* Expanded Details Row */}
                                                {expandedRows[res.model.id] && res.status === 'available' && (
                                                    <tr className="bg-slate-50 animate-in">
                                                        <td colSpan={adminSettings.showCostPrice && adminUnlocked ? 6 : 5} className="px-4 py-3">
                                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                                {/* Detalii Segmente */}
                                                                <div>
                                                                    <h4 className="text-xs font-bold text-slate-500 uppercase mb-2">Detalii Calcul</h4>
                                                                    <div className="space-y-1">
                                                                        {res.details.map((d, i) => (
                                                                            <div key={i} className="flex justify-between text-xs bg-white p-2 rounded">
                                                                                <span className="text-slate-600">{d.label}</span>
                                                                                <span className="font-mono">
                                                                                    <span className="text-slate-500">{d.pcs} buc</span>
                                                                                    <span className="mx-2 text-slate-300">→</span>
                                                                                    <span className="font-bold">{d.priceTotal.toFixed(2)} RON</span>
                                                                                </span>
                                                                            </div>
                                                                        ))}
                                                                    </div>
                                                                </div>

                                                                {/* Accesorii */}
                                                                {includeAccessories && (
                                                                    <div>
                                                                        <h4 className="text-xs font-bold text-slate-500 uppercase mb-2">Accesorii Necesare</h4>
                                                                        <div className="bg-white p-3 rounded">
                                                                            {res.model.fixType === 'screw' ? (
                                                                                <div className="flex justify-between items-center">
                                                                                    <div>
                                                                                        <div className="font-bold text-slate-800">{ACCESSORIES.screw.label}</div>
                                                                                        <div className="text-xs text-slate-500">
                                                                                            {res.accessories.screws} buc necesare → {res.accessories.screwBoxes} cutii
                                                                                        </div>
                                                                                    </div>
                                                                                    <div className="text-right">
                                                                                        <div className="font-bold text-slate-800">
                                                                                            {(res.accessories.screwBoxes * ACCESSORIES.screw.priceRON).toFixed(2)} RON
                                                                                        </div>
                                                                                        <div className="text-[10px] text-slate-400">
                                                                                            {ACCESSORIES.screw.priceRON} RON/cutie
                                                                                        </div>
                                                                                    </div>
                                                                                </div>
                                                                            ) : (
                                                                                <div className="flex justify-between items-center">
                                                                                    <div>
                                                                                        <div className="font-bold text-slate-800">{ACCESSORIES.rivet.label}</div>
                                                                                        <div className="text-xs text-slate-500">
                                                                                            {res.accessories.rivets} bucăți necesare
                                                                                        </div>
                                                                                    </div>
                                                                                    <div className="text-right">
                                                                                        <div className="font-bold text-slate-800">
                                                                                            {(res.accessories.rivets * ACCESSORIES.rivet.priceRON).toFixed(2)} RON
                                                                                        </div>
                                                                                        <div className="text-[10px] text-slate-400">
                                                                                            {ACCESSORIES.rivet.priceRON} RON/buc
                                                                                        </div>
                                                                                    </div>
                                                                                </div>
                                                                            )}
                                                                        </div>
                                                                    </div>
                                                                )}
                                                            </div>
                                                        </td>
                                                    </tr>
                                                )}
                                            </React.Fragment>
                                        ))}
                                    </tbody>
                                </table>
                            </div>

                            {/* Footer Actions */}
                            <div className="bg-slate-50 p-4 border-t flex flex-col sm:flex-row justify-between items-center gap-3 no-print">
                                <div className="text-xs text-slate-500">
                                    {selectedModel ? (
                                        <span className="text-green-600 font-bold">
                                            ✓ Model selectat: {selectedModel.model.name} ({selectedModel.priceTotal.toFixed(2)} RON)
                                        </span>
                                    ) : (
                                        'Selectează un model pentru a genera oferta'
                                    )}
                                </div>
                                <div className="flex gap-3">
                                    {client.phone && client.phone.length >= 10 && (
                                        <a
                                            href={`https://wa.me/4${client.phone.replace(/\D/g, '')}?text=${encodeURIComponent(`Bună ziua! Vă trimit oferta pentru șipcă metalică gard.`)}`}
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            className="bg-green-600 text-white px-4 py-2.5 rounded-xl font-bold shadow-lg hover:bg-green-700 flex items-center gap-2 transition"
                                        >
                                            <Icon name="MessageSquare"/> WhatsApp
                                        </a>
                                    )}
                                    <button
                                        onClick={generatePDF}
                                        disabled={!selectedModel}
                                        className="bg-slate-800 text-white px-4 py-2.5 rounded-xl font-bold hover:bg-slate-900 flex items-center gap-2 transition disabled:opacity-50 disabled:cursor-not-allowed"
                                    >
                                        <Icon name="Download"/> Descarcă PDF
                                    </button>
                                    <button
                                        onClick={() => window.print()}
                                        className="bg-white text-slate-600 px-4 py-2.5 rounded-xl font-bold border border-slate-200 hover:bg-slate-50 flex items-center gap-2 transition"
                                    >
                                        <Icon name="Printer"/> Print
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                {/* ============ PDF TEMPLATE (Hidden) ============ */}
                {selectedModel && (
                    <div ref={pdfRef} className="fixed -left-[9999px] w-[210mm] bg-white p-8 text-sm" style={{ fontFamily: 'Arial, sans-serif' }}>
                        {/* PDF Header */}
                        <div className="flex justify-between items-start mb-8 pb-4 border-b-2 border-red-600">
                            <div>
                                <h1 className="text-2xl font-bold text-red-600">{agent.company}</h1>
                                <p className="text-slate-600">{agent.name}</p>
                                <p className="text-slate-500 text-xs">{agent.phone} | {agent.email}</p>
                            </div>
                            <div className="text-right">
                                <div className="text-xs text-slate-400">OFERTĂ DE PREȚ</div>
                                <div className="font-bold text-lg">#{Date.now().toString().slice(-8)}</div>
                                <div className="text-xs text-slate-500">Data: {client.date}</div>
                                <div className="text-xs text-slate-500">Valabil: {adminSettings.quoteValidity} zile</div>
                            </div>
                        </div>

                        {/* Client Info */}
                        <div className="mb-6 p-4 bg-slate-50 rounded">
                            <h3 className="font-bold text-slate-700 mb-2">Date Client</h3>
                            <div className="grid grid-cols-2 gap-4 text-sm">
                                <div><span className="text-slate-500">Nume:</span> <strong>{client.name || '-'}</strong></div>
                                <div><span className="text-slate-500">Telefon:</span> <strong>{client.phone || '-'}</strong></div>
                                <div><span className="text-slate-500">Locație:</span> <strong>{client.location || '-'}</strong></div>
                                <div><span className="text-slate-500">Email:</span> <strong>{client.email || '-'}</strong></div>
                            </div>
                        </div>

                        {/* Product Details */}
                        <div className="mb-6">
                            <h3 className="font-bold text-slate-700 mb-3">Specificații Produs</h3>
                            <table className="w-full border-collapse text-sm">
                                <tbody>
                                    <tr className="border-b">
                                        <td className="py-2 text-slate-500">Model:</td>
                                        <td className="py-2 font-bold">{selectedModel.model.name} ({selectedModel.model.provider})</td>
                                    </tr>
                                    <tr className="border-b">
                                        <td className="py-2 text-slate-500">Grosime:</td>
                                        <td className="py-2 font-bold">{filterThickness} mm</td>
                                    </tr>
                                    <tr className="border-b">
                                        <td className="py-2 text-slate-500">Finisaj:</td>
                                        <td className="py-2 font-bold">{filterFinish}</td>
                                    </tr>
                                    <tr className="border-b">
                                        <td className="py-2 text-slate-500">Culoare:</td>
                                        <td className="py-2 font-bold">{filterColor ? `RAL ${filterColor}` : 'La alegere'}</td>
                                    </tr>
                                    <tr className="border-b">
                                        <td className="py-2 text-slate-500">Montaj:</td>
                                        <td className="py-2 font-bold">{mountType === 'vertical' ? 'Vertical' : 'Orizontal'}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        {/* Quantity Table */}
                        <div className="mb-6">
                            <h3 className="font-bold text-slate-700 mb-3">Detalii Cantitate</h3>
                            <table className="w-full border-collapse text-sm">
                                <thead>
                                    <tr className="bg-slate-100">
                                        <th className="py-2 px-3 text-left border">Descriere</th>
                                        <th className="py-2 px-3 text-center border">Bucăți</th>
                                        <th className="py-2 px-3 text-right border">Preț/buc</th>
                                        <th className="py-2 px-3 text-right border">Total</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {selectedModel.details.map((d, i) => (
                                        <tr key={i}>
                                            <td className="py-2 px-3 border">{d.label}</td>
                                            <td className="py-2 px-3 text-center border">{d.pcs}</td>
                                            <td className="py-2 px-3 text-right border">{d.priceUnit.toFixed(2)} RON</td>
                                            <td className="py-2 px-3 text-right border font-bold">{d.priceTotal.toFixed(2)} RON</td>
                                        </tr>
                                    ))}
                                </tbody>
                                <tfoot>
                                    <tr className="bg-slate-50 font-bold">
                                        <td className="py-3 px-3 border" colSpan="2">TOTAL ȘIPCĂ</td>
                                        <td className="py-3 px-3 text-center border">{selectedModel.totalPieces} buc</td>
                                        <td className="py-3 px-3 text-right border text-lg">{selectedModel.priceTotal.toFixed(2)} RON</td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>

                        {/* Accessories */}
                        {includeAccessories && (
                            <div className="mb-6">
                                <h3 className="font-bold text-slate-700 mb-3">Accesorii Recomandate</h3>
                                <table className="w-full border-collapse text-sm">
                                    <tbody>
                                        {selectedModel.model.fixType === 'screw' ? (
                                            <tr>
                                                <td className="py-2 px-3 border">{ACCESSORIES.screw.label}</td>
                                                <td className="py-2 px-3 text-center border">{selectedModel.accessories.screwBoxes} cutii (250 buc/cutie)</td>
                                                <td className="py-2 px-3 text-right border font-bold">
                                                    {(selectedModel.accessories.screwBoxes * ACCESSORIES.screw.priceRON).toFixed(2)} RON
                                                </td>
                                            </tr>
                                        ) : (
                                            <tr>
                                                <td className="py-2 px-3 border">{ACCESSORIES.rivet.label}</td>
                                                <td className="py-2 px-3 text-center border">{selectedModel.accessories.rivets} buc</td>
                                                <td className="py-2 px-3 text-right border font-bold">
                                                    {(selectedModel.accessories.rivets * ACCESSORIES.rivet.priceRON).toFixed(2)} RON
                                                </td>
                                            </tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        )}

                        {/* Grand Total */}
                        <div className="bg-red-600 text-white p-4 rounded mb-6">
                            <div className="flex justify-between items-center">
                                <span className="text-lg font-bold">TOTAL GENERAL (fără TVA)</span>
                                <span className="text-2xl font-bold">
                                    {(selectedModel.priceTotal + (includeAccessories ? (
                                        selectedModel.model.fixType === 'screw'
                                            ? selectedModel.accessories.screwBoxes * ACCESSORIES.screw.priceRON
                                            : selectedModel.accessories.rivets * ACCESSORIES.rivet.priceRON
                                    ) : 0)).toFixed(2)} RON
                                </span>
                            </div>
                        </div>

                        {/* Footer */}
                        <div className="text-xs text-slate-500 text-center border-t pt-4">
                            <p>Această ofertă este valabilă {adminSettings.quoteValidity} zile de la data emiterii.</p>
                            <p className="mt-1">Prețurile nu includ TVA și transport.</p>
                            <p className="mt-2 font-bold text-slate-700">{agent.company} | {agent.phone} | {agent.email}</p>
                        </div>
                    </div>
                )}
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>

</body>
</html>
